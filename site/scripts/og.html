<!doctype html>
<!-- Source of src/og-fr.png and src/og-en.png (1200x630 social preview), same palette
     and faces as the site (Carnival tokens, src/assets/tokens.css). Regenerate: see
     "Image de partage" in README.md. #en selects English. The headline follows the h1
     of the home page. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planning Équipes, image de partage</title>
<style>
  @font-face { font-family: "Big Shoulders Display"; font-weight: 100 900; src: url("../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Golos Text"; font-weight: 400 900; src: url("../node_modules/@fontsource-variable/golos-text/files/golos-text-latin-wght-normal.woff2") format("woff2"); }
  :root {
    --paper: oklch(92% 0.045 50); --ink: oklch(18% 0.080 20); --accent: oklch(86% 0.18 95); --accent-2: oklch(40% 0.21 25);
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 64px 72px;
    background: var(--paper); color: var(--ink);
    font: 400 30px/1.3 "Golos Text", system-ui, sans-serif;
    border-bottom: 16px solid var(--accent-2);
  }
  .name { margin: 0 0 28px; font: 800 40px/1 "Big Shoulders Display", Impact, sans-serif; letter-spacing: 0.015em; text-transform: uppercase; }
  h1 { margin: 0 0 28px; max-width: 13ch; font: 800 116px/0.98 "Big Shoulders Display", Impact, sans-serif; letter-spacing: 0.015em; text-transform: uppercase; }
  p { margin: 0; max-width: 34ch; }
  .ticket { position: absolute; right: 72px; bottom: 96px; padding: 20px 28px; background: var(--accent); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); transform: rotate(-2deg); font: 800 64px/1 "Big Shoulders Display", Impact, sans-serif; }
  [lang="en"] { display: none; }
  body.en [lang="fr"] { display: none; }
  body.en [lang="en"] { display: block; }
</style>
</head>
<body>
<p class="name">Planning Équipes</p>
<div lang="fr">
  <h1>Planifiez en minutes, pas en&nbsp;week-ends.</h1>
  <p>Animateurs, bénévoles et mineurs, Code du travail compris</p>
</div>
<div lang="en">
  <h1>Schedule in minutes, not weekends.</h1>
  <p>Staff, volunteers and under-18s, French Labour Code included</p>
</div>
<div class="ticket">L3163-1</div>
<script>if (location.hash === '#en') document.body.className = 'en';</script>
</body>
</html>
