# Surcharge de docker-compose.yml (à la racine du dépôt) pour le tournage des
# captures de la vitrine : une horloge que le script peut figer, et rien de plus.
# L'application, PostgreSQL et Mailpit sont ceux du profil `app` du dépôt.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/sylvainmetayer/planning-equipes:main}
    environment:
      HORLOGE_SIMULEE_AUTORISEE: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?tourner.sh le fournit}
      # Le QR code et le lien des PDF d'exemple : une adresse réservée, pas localhost
      PUBLIC_URL: https://planning.example.org
      # Les écrans de la documentation ouvrent des sessions de comptes locaux : pas de code reçu par e-mail à saisir
      AUTH_LOCAL_SECONDE_ETAPE: "false"
      # Le calcul filmé dure moins d'une minute : le plan est faisable en quelques secondes,
      # la suite n'améliore que la qualité. Le budget est celui de l'instance, plus celui du scénario.
      SOLVER_SECONDS_LIMIT: "40"
      SOLVER_UNIMPROVED_SECONDS_LIMIT: "0"
  pgadmin:
    profiles: ["jamais"]
