  - name: accueil
    label: Accueil
    type: file
    path: src/_data/pages/accueil.json
    format: json
    description: "Le texte de la page d'accueil. Les captures et vidéos se remplacent dans « Captures et images » et « Vidéos » (mêmes noms de fichier)."
    fields:
      - { name: titre, label: Titre Google (65 caractères au plus), type: string, required: true, options: { maxlength: 65 } }
      - { name: description, label: Description Google (155 caractères au plus), type: text, required: true, options: { maxlength: 155 } }
      - { name: ogTitre, label: Titre des réseaux sociaux, type: string, required: true }
      - { name: h1, label: Titre de la page (7 mots au plus), type: string, required: true }
      - { name: lede, label: Phrase d'accroche (12 mots au plus), type: string, required: true }
      - { name: cta, label: Bouton principal, type: string, required: true }
      - { name: cta2, label: Bouton secondaire, type: string, required: true }
      - { name: heroAlt, label: Description de la capture d'accueil, type: string, required: true }
      - { name: heroLegende, label: Légende de la capture d'accueil, type: string, required: true }
      - { name: ticketTitre, label: Titre de la carte règle sur la capture, type: string, required: true }
      - name: loi
        label: Section Code du travail (le premier refus s'affiche aussi sur la capture d'accueil)
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: reponse, label: Réponse (Markdown, gras permis), type: text, required: true }
          - { name: refusTitre, label: Titre du tableau, type: string, required: true }
          - { name: refusColonnes, label: Colonnes du tableau, type: string, list: true }
          - name: refus
            label: Postes refusés (exemples fictifs)
            type: object
            list:
              collapsible: { collapsed: true, summary: "{qui}" }
            fields:
              - { name: qui, label: Personne, type: string, required: true }
              - { name: poste, label: Poste refusé, type: string, required: true }
              - { name: raison, label: Raison, type: string, required: true }
              - { name: article, label: Article (doit exister dans ConstraintCatalog), type: string, required: true, pattern: { regex: "^[LRD][0-9]{4}-[0-9]+$", message: "Ex. L3131-1" } }
          - { name: exemple, label: Mention « exemple fictif », type: string, required: true }
          - { name: lien, label: Lien vers la page détaillée, type: string, required: true }
          - { name: mention, label: Mention sur l'employeur, type: string, required: true }
      - name: jourj
        label: Section jour J
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: intro, label: Introduction, type: text, required: true }
          - { name: points, label: Points (trois), type: string, list: true }
          - { name: film, label: Vidéo associée (identifiant), type: string, required: true }
      - name: equipes
        label: Section animateurs et bénévoles
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: texte, label: Texte (Markdown, gras permis), type: text, required: true }
          - name: tuiles
            label: Tuiles (quatre)
            type: object
            list:
              collapsible: { collapsed: true, summary: "{titre}" }
            fields:
              - { name: titre, label: Titre, type: string, required: true }
              - { name: texte, label: Texte, type: string, required: true }
          - { name: lien, label: Lien vers la page bénévoles, type: string, required: true }
          - { name: outils, label: Texte « messageries », type: text, required: true }
          - { name: film, label: Vidéo associée (identifiant), type: string, required: true }
      - name: cas
        label: Section le calcul
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: intro, label: Introduction, type: text, required: true }
          - name: niveaux
            label: Niveaux (trois)
            type: object
            list:
              collapsible: { collapsed: true, summary: "{titre}" }
            fields:
              - { name: titre, label: Titre, type: string, required: true }
              - { name: texte, label: Texte, type: string, required: true }
          - { name: lien, label: Lien vers la page du calcul, type: string, required: true }
          - { name: film, label: Vidéo associée (identifiant), type: string, required: true }
      - name: images
        label: Section les écrans (captures et vidéos)
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: intro, label: Introduction, type: text, required: true }
          - name: films
            label: Vidéos
            type: object
            list:
              collapsible: { collapsed: true, summary: "{titre}" }
            fields:
              - { name: id, label: Identifiant (nom du fichier .mp4), type: string, required: true }
              - { name: titre, label: Titre, type: string, required: true }
              - { name: secondes, label: Durée (secondes), type: number, required: true }
              - { name: legende, label: Légende, type: text, required: true }
              - { name: transcription, label: Transcription (une étape par ligne), type: text, list: true, required: true }
          - name: filmsLabels
            label: Mots des vidéos
            type: object
            fields:
              - { name: transcription, label: Titre de la transcription, type: string, required: true }
              - { name: sansSon, label: Sous-titre unique des vidéos sans son, type: string, required: true }
              - { name: telecharger, label: Lien de téléchargement, type: string, required: true }
              - { name: unite, label: Unité du poids (ko ou kB), type: string, required: true }
              - { name: duree, label: Unité de durée, type: string, required: true }
          - name: ecrans
            label: Écrans
            type: object
            list:
              collapsible: { collapsed: true, summary: "{titre}" }
            fields:
              - { name: id, label: Identifiant (nom du fichier .webp), type: string, required: true }
              - { name: titre, label: Titre, type: string, required: true }
              - { name: alt, label: "Description (« Nom : ce qu'il montre », la partie après les deux-points s'affiche)", type: string, required: true }
      - name: ensemble
        label: Section contact
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: prix, label: Tarif, type: text, required: true }
          - name: etapes
            label: Étapes
            type: object
            list:
              collapsible: { collapsed: true, summary: "{titre}" }
            fields:
              - { name: titre, label: Titre, type: string, required: true }
              - { name: vous, label: Ce que vous faites, type: text, required: true }
              - { name: nous, label: Ce que nous faisons, type: text, required: true }
          - { name: vous, label: Mot « Vous », type: string, required: true }
          - { name: nous, label: Mot « Nous », type: string, required: true }
          - { name: cta, label: Bouton, type: string, required: true }
          - { name: soiMeme, label: Lien vers la page héberger, type: string, required: true }
      - name: faq
        label: Section questions
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: toutes, label: Lien vers toutes les questions, type: string, required: true }
      - name: types
        label: Section « Pour quel événement ? »
        type: object
        fields:
          - { name: h2, label: Titre, type: string, required: true }
          - { name: intro, label: Introduction, type: string, required: true }
      - name: en
