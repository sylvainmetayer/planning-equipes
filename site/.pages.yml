  - name: legal
    label: Page Code du travail et mineurs
    type: file
    path: src/_data/pages/legal.json
    format: json
    description: "Les dix articles et leurs règles ne s'éditent pas ici : src/_data/articles.js, testé contre ConstraintCatalog."
    fields:
      - { name: slug, label: Adresse (sans les barres), type: string, required: true, pattern: { regex: "^[a-z0-9-]+$", message: "Minuscules, chiffres et tirets" } }
      - { name: titre, label: Titre Google (65 caractères au plus), type: string, required: true, options: { maxlength: 65 } }
      - { name: description, label: Description Google (155 caractères au plus), type: text, required: true, options: { maxlength: 155 } }
      - { name: h1, label: Question de la page, type: string, required: true }
      - { name: reponse, label: Réponse directe (Markdown), type: text, required: true }
      - { name: articlesH, label: Titre du tableau des articles, type: string }
      - { name: colonnes, label: Colonnes du tableau des articles, type: string, list: true }
      - name: sections
        label: Sections
        type: object
        list:
          collapsible: { collapsed: true, summary: "{h2}" }
        fields:
          - { name: h2, label: Titre, type: string, required: true }
