              - { name: faq, label: Questions, type: string, required: true }
              - { name: contact, label: Bouton de contact, type: string, required: true }
              - { name: langue, label: Lien vers l'autre langue, type: string, required: true }
              - { name: langueLabel, label: Lien vers l'autre langue (lecteurs d'écran), type: string, required: true }
          - { name: skip, label: Lien d'évitement, type: string, required: true }
