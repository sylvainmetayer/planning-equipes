# Pages CMS (https://pagescms.org) : l'admin de la vitrine planning.sylvain.dev.
# Connexion GitHub, rien à héberger ; chaque enregistrement est un commit.
# Périmètre : les textes (français à la racine du fichier, anglais sous la clé
# « en »), les questions fréquentes, les légendes et transcriptions des vidéos,
# les images. Ne s'éditent pas ici : les articles du Code du travail
# (src/_data/articles.js, testés contre ConstraintCatalog), le jeton de mesure
# d'audience (src/_data/site.json) et le code.
#
# Chaque fichier déclare TOUS ses champs : un champ non déclaré peut être perdu à
# l'enregistrement. Un champ ajouté au JSON doit l'être ici aussi, dans les deux
# langues (le bloc « en » recopie les champs français) : `npm test` le vérifie.
# Les articles cités dans un texte (L3131-1…) doivent exister dans ConstraintCatalog :
# `npm test` le vérifie.

media:
  - name: images
    label: Captures et images
    input: src/images
    output: /images
    extensions: [webp, png]
  - name: videos
    label: Vidéos
    input: src/videos
    output: /videos
    extensions: [mp4]

content:
  - name: commun
    label: Commun (menu, pied de page, page 404)
    type: file
    path: src/_data/pages/commun.json
    format: json
    fields:
      - name: nav
        label: Menu
        type: object
        fields:
          - { name: label, label: Nom du menu (lecteurs d'écran), type: string, required: true }
          - { name: accueil, label: Accueil, type: string, required: true }
          - { name: legal, label: Code du travail, type: string, required: true }
          - { name: equipe, label: Équipe, type: string, required: true }
          - { name: calcul, label: Le calcul, type: string, required: true }
          - { name: hebergement, label: Héberger, type: string, required: true }
          - { name: faq, label: Questions, type: string, required: true }
          - { name: contact, label: Bouton de contact, type: string, required: true }
          - { name: langue, label: Lien vers l'autre langue, type: string, required: true }
          - { name: langueLabel, label: Lien vers l'autre langue (lecteurs d'écran), type: string, required: true }
      - { name: skip, label: Lien d'évitement, type: string, required: true }
      - { name: logoLabel, label: Logo (lecteurs d'écran), type: string, required: true }
      - { name: contactSujet, label: Objet des e-mails de contact, type: string, required: true }
      - { name: voirAussi, label: Titre « à lire aussi », type: string, required: true }
      - name: pied
        label: Pied de page
        type: object
        fields:
          - { name: licence, label: Licence, type: string, required: true }
          - { name: codeSource, label: Lien code source, type: string, required: true }
          - { name: fictif, label: Mention « données fictives », type: string, required: true }
          - { name: editeur, label: Éditeur et hébergeur, type: text, required: true }
          - { name: liens, label: Nom de la liste (lecteurs d'écran), type: string, required: true }
          - { name: mentions, label: Lien mentions légales, type: string, required: true }
          - { name: nouveautes, label: Lien nouveautés, type: string, required: true }
          - { name: probleme, label: Lien signaler un problème, type: string, required: true }
          - { name: ecrire, label: Lien « nous écrire », type: string, required: true }
      - name: theme
