# Playwright, à chaque poussée et sur chaque pull request.
#
# Ces tests demandent la pile complète (application + PostgreSQL + serveur
# de mail) et réamorcent la base à chaque exécution : ils coûtent donc
# plusieurs minutes là où la suite unitaire répond en six secondes. Le coût est
# assumé — trois défauts d'interface de la pile #331..#338 ont été trouvés par
# un humain qui cliquait, pas par la CI : un créneau sans siège qui ouvrait un
# écran en erreur, une échelle d'heures qui quittait l'écran à 153 lignes, et
# un champ de filtre qui perdait le focus à chaque caractère. Aucun n'était
# visible d'un test unitaire, tous l'étaient d'un navigateur.
#
# L'exécution nocturne qui précédait avait le défaut inverse de sa qualité :
# elle ne bloquait rien. Le défaut corrigé par `8edef84` (six champs sans
# attribut `name`, donc sans libellé accessible) a survécu six jours à un test
# e2e écrit exprès pour lui — le test existait, il échouait, personne ne le
# regardait. Un test qui ne barre pas la route se lit comme un test qui passe.
name: Tests E2E

# Une poussée qui ne touche que la documentation ne monte pas la pile : rien
# de ce qu'un navigateur voit n'a changé. Sur une PR, GitHub évalue ce filtre
# sur l'ensemble des fichiers de la PR, pas sur la dernière poussée — une PR
# mixte code + docs rejoue donc tout à chaque poussée, et c'est voulu.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Par référence, et annulable : une poussée qui en suit une autre rend la
# précédente sans objet, et une suite Playwright abandonnée ne consomme plus
# de minutes facturées.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Même garde de fork que tests.yml, conservée pour la même raison.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-suite.yml
    with:
      # Tout sauf les specs @lourd — la semaine canicule sur festival-hivernal
      # pesait 13 des 20 minutes de la suite ; elle tourne dans e2e-lourd.yml.
      playwright-args: --grep-invert @lourd
      # Keycloak ET compte de secours : l'administration se connecte par le
      # formulaire de secours (le globalSetup aussi), l'espace animateur par
      # un vrai compte Keycloak — c'est la seule porte qu'il ait.
      authentification: keycloak-secours
      # Le dernier passage complet sans @lourd tient en ~10 min, montage de la
      # pile compris ; un runner lent a de la marge, un blocage n'en a pas.
      # Keycloak (image, realm, une connexion par ouverture d'espace) en
      # ajoute quelques-unes.
      timeout-minutes: 30

  # La pile telle que la production la monte : Keycloak seul, compte de secours
  # fermé. Sa suite (playwright.oidc.config.ts) éprouve ce que la précédente
  # ne peut pas voir — le second facteur exigé de l'administrateur, le 409 du
  # formulaire de secours, le provisioning des comptes, la déconnexion
  # RP-initiated, le serveur MCP en OAuth2. Une pile à elle parce que le
  # secours fermé interdit le globalSetup de la suite principale.
  e2e-keycloak:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-suite.yml
    with:
      playwright-args: ''
      authentification: keycloak
      # Chaque connexion administrateur peut attendre une fenêtre TOTP neuve
      # (jusqu'à trente secondes) : la suite est courte mais lente.
      timeout-minutes: 30
