# La suite Playwright ordinaire (tout sauf les specs @lourd), à la demande.
#
# Sur chaque poussée et chaque pull request, elle tourne désormais dans
# `tests.yml`, job `e2e`, sur l'application que le job `test` vient de packager
# pour ses propres tests d'intégration : la construire ici une seconde fois
# refaisait le bundle Angular pour un jar identique. Ce workflow reste pour la
# rejouer seule, sans les vingt minutes de la suite backend — il package alors
# l'application lui-même.
#
# Pourquoi cette suite barre la route, et pourquoi à chaque poussée plutôt que
# chaque nuit : voir l'en-tête du job `e2e` de `tests.yml`.
name: Tests E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: ./.github/workflows/e2e-suite.yml
    with:
      # Tout sauf les specs @lourd — la semaine canicule sur festival-hivernal
      # pesait 13 des 20 minutes de la suite ; elle tourne dans e2e-lourd.yml.
      playwright-args: --grep-invert @lourd
      # Le dernier passage complet sans @lourd tient en ~10 min, montage de la
      # pile compris ; un runner lent a de la marge, un blocage n'en a pas.
      timeout-minutes: 25
