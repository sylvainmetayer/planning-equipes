name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests, then integration tests (*IT) against the packaged app
      # (skipITs defaults to true in the pom). PostgreSQL is provided by
      # Quarkus dev services (Docker is preinstalled on GitHub runners), so no
      # service container is required here.
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress verify -DskipITs=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/main/webui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vitest runs in a Node/jsdom environment (no browser needed) and, when
      # not attached to a TTY, executes once and exits instead of watching.
      - name: Run unit tests
        run: npm test
