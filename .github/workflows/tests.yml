name: Tests

# Une poussée qui ne touche que la documentation ne joue pas la suite — sauf
# les fichiers qu'un test relit (DocumentationStructuralTest, McpToolNamesTest)
# ou que ce job compare à ce qu'il produit (le contrat OpenAPI, l'inventaire
# des licences). Sur une PR, GitHub évalue ce filtre sur l'ensemble des
# fichiers de la PR, pas sur la dernière poussée : une PR mixte code + docs
# rejoue tout à chaque poussée, et c'est voulu. Aucun check n'est requis sur
# main aujourd'hui ; le jour où l'un le devient, il faudra un job toujours
# présent qui conclut succès quand ce filtre a sauté le vrai.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/schema/**'
      - 'docs/licences-tierces.md'
      - 'docs/api.md'
      - 'docs/contraintes.md'
      - 'docs/mcp.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/schema/**'
      - 'docs/licences-tierces.md'
      - 'docs/api.md'
      - 'docs/contraintes.md'
      - 'docs/mcp.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Runner GitHub : le résultat des tests se suit depuis la PR, sans dépendre
    # de la disponibilité de la machine d'un seul développeur. Le prix est que
    # ces minutes sont facturées — voir docs/developpement.md.
    #
    # La garde sur les PR de fork tenait au socket Docker du runner
    # auto-hébergé, sur lequel une PR externe aurait fait tourner du code
    # arbitraire en root. Elle est conservée telle quelle : la lever est une
    # décision d'ouverture publique (#286), pas un effet de bord d'un
    # changement de runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # La suite backend tourne ~20 min sur la machine de développement ; un
    # runner GitHub est plus lent, d'où la marge. Au-delà, c'est pendu.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `mvn verify`'s package phase runs quarkus:build, which activates
      # Quinoa (only disabled on the %test profile, not on package/verify) —
      # it downloads its own pinned Node binary and runs `npm ci` for the
      # frontend on every run otherwise. Both live outside src/main/webui's
      # node_modules cache-by-lockfile story (the frontend job's own
      # `actions/setup-node` `cache: npm` doesn't apply here: this job never
      # sets up a system Node, Quinoa uses its own isolated one), so they're
      # cached separately, keyed on what actually invalidates each one.
      - name: Cache Quinoa's Node.js binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .quinoa
          key: quinoa-node-${{ runner.os }}-${{ hashFiles('src/main/resources/application.properties') }}

      - name: Cache Quinoa's npm ci output (frontend node_modules)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/main/webui/node_modules
          key: quinoa-node-modules-${{ runner.os }}-${{ hashFiles('src/main/webui/package-lock.json') }}

      # Un fichier commité que le dépôt ne produit plus est un fichier qu'on
      # cesse de croire. L'inventaire des licences tierces
      # (docs/licences-tierces.md) est la réponse donnée à qui déploie l'image
      # — il ne vaut que s'il décrit les dépendances d'aujourd'hui, et Renovate
      # en change chaque semaine. Ce job est le seul qui puisse le vérifier :
      # il faut Maven pour résoudre le côté Java, et `node` est préinstallé sur
      # les runners GitHub, donc le côté npm suit sans installation (le script
      # lit le verrou, pas node_modules).
      #
      # Avant les tests, pas après : le contrôle ne demande que la résolution
      # des dépendances, une minute, et un bump Maven le fait échouer par
      # construction — huit PR Renovate ont attendu treize minutes de tests
      # pour l'apprendre. Sur ces branches, licences-renovate.yml régénère le
      # fichier et relance ce workflow.
      - name: Check the committed third-party licence inventory
        run: |
          ./mvnw -B --no-transfer-progress license:add-third-party
          node src/main/webui/scripts/licences-tierces.js --check

      # Unit tests, then integration tests (*IT) against the packaged app
      # (skipITs defaults to true in the pom). PostgreSQL is provided by
      # Quarkus dev services (Docker is preinstalled on GitHub runners), so no
      # service container is required here.
      # -Pcoverage attaches the JaCoCo agent, on main only. Nothing consumes
      # the result but a person hunting for a gap, and that person reads the
      # report of main, not of a branch; instrumenting every pull request
      # cost the instrumentation and the artifact for nobody.
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress verify -DskipITs=false ${{ github.event_name == 'push' && '-Pcoverage' || '' }}

      # Named, or nobody knows them: the job takes twenty minutes and the
      # report says which classes take them. Read this before converting
      # tests by hand — the gain is in the slow ones.
      - name: The ten slowest test classes
        if: always()
        run: |
          grep -ho '<testsuite [^>]*' target/surefire-reports/TEST-*.xml \
            | sed -E 's/.* name="([^"]+)".* time="([0-9.]+)".*/\2 \1/' \
            | sort -rn | head -10

      # Le contrat commité doit être celui que ce build vient de produire. Ce
      # contrôle ne peut vivre que dans ce job : c'est le seul qui a un
      # `target/`. Le job `frontend` compare models.ts au contrat, mais ne peut
      # pas savoir si le contrat lui-même a pris du retard.
      - name: Check the committed OpenAPI contract is the one this build produces
        run: |
          if ! diff -q target/openapi/openapi.json docs/schema/openapi.json > /dev/null; then
            echo "::error::docs/schema/openapi.json ne correspond plus à l'API."
            echo "Régénérez-le : ./mvnw package -DskipTests puis, depuis src/main/webui, npm run api-schema"
            diff target/openapi/openapi.json docs/schema/openapi.json | head -40
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

      # Ce que le job `e2e` ci-dessous lance, au lieu de le reconstruire : le
      # `verify` ci-dessus a déjà packagé l'application, Quinoa compris, et
      # `e2e-suite.yml` s'en contentait si peu qu'il refaisait un
      # `./mvnw package` — troisième construction du bundle Angular par poussée
      # (audit #392, C9). Deux minutes d'artefact contre cinq de build, et les
      # specs s'exécutent désormais contre le binaire que la suite backend vient
      # de vérifier.
      #
      # Un jour de rétention : rien ne relit cet artefact après le run qui
      # l'a produit — le journal d'un échec, lui, est gardé sept jours.
      - name: Upload the packaged application for the E2E stack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-packagee
          path: target/quarkus-app
          if-no-files-found: error
          retention-days: 1

      - name: Upload the backend coverage report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: |
            target/site/jacoco/**
            target/jacoco.exec
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    # Même garde de fork que le job `test` ci-dessus.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Sans plafond, un job pendu consomme des minutes facturées jusqu'à la
    # limite de six heures de GitHub.
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src/main/webui

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : le cliquet linguistique compare la branche à sa
          # base, et le clone superficiel par défaut ne connaît pas `origin/main`.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      # Les règles d'AGENTS.md sur les messages de commit (sujet < 72, préfixe
      # conventionnel, deux trailers et pas d'autres) n'étaient tenues par
      # personne : #392 a compté 14 trailers étrangers sur 50 commits. Ici,
      # parce que ce job a l'historique complet (fetch-depth: 0).
      - name: Check the commit messages of this branch
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash .github/scripts/check-commits.sh "origin/${{ github.base_ref }}"

      # Same job, same reason: the SHA a reformatting had on its branch is not
      # the one main received, and `git blame` ignores an unknown one silently.
      - name: Check that every ignored revision is an ancestor
        working-directory: .
        run: bash .github/scripts/check-blame-ignore-revs.sh

      - name: Install dependencies
        run: npm ci

      # The conventions of this frontend (OnPush everywhere, function-based
      # input()/output(), @for with a track, no `any`) held by discipline alone
      # until now. This is what defends them when someone else contributes.
      - name: Lint
        run: npm run lint

      # Formatting is not a review topic either: prettier decides for the
      # TypeScript, the CSS and the scripts (`npm run format` obeys). The
      # templates are left out on purpose — in an Angular template a blank
      # between two inline elements is rendering, and a reflow changed one.
      - name: Format check
        run: npm run format-check

      # Vitest runs in a Node/jsdom environment (no browser needed) and, when
      # not attached to a TTY, executes once and exits instead of watching.
      # `test:coverage` runs exactly the same tests, instrumented. One run
      # rather than two: instrumentation costs tens of seconds, a second pass
      # would cost the whole suite again.
      - name: Run unit tests
        run: npm run test:coverage

      # Rien d'autre ne voit dériver le catalogue anglais : `$localize` retombe
      # silencieusement sur la source française, donc un écran à moitié traduit
      # ne lève d'erreur ni au build, ni à l'exécution, ni dans les tests — il
      # est simplement à moitié traduit, dans une langue que celui qui l'a
      # écrit ne lit pas. C'est ainsi que 56 identifiants s'étaient accumulés.
      # Le script échoue aussi sur un placeholder divergent, qui casse à
      # l'affichage et en anglais seulement : le plus discret des trois cas.
      - name: Check the English catalogue against the source strings
        run: npm run i18n-check

      # Le contrôle ci-dessus compare des identifiants et des placeholders,
      # jamais le texte : une source française réécrite sous le même id laisse
      # l'anglais dire l'ancienne version, et tout reste vert. Ici, la branche
      # est comparée à sa base (extraction des sources de la base dans un
      # worktree jetable, d'où le fetch-depth: 0) : un id dont le français a
      # changé sans que l'anglais bouge est signalé. Un cliquet, comme la
      # politique linguistique : il porte sur ce que la branche réécrit.
      - name: Check that a rewritten French source moved its English too
        run: npm run i18n-check-modifies -- "origin/${{ github.base_ref || 'main' }}"

      # `models.ts` est écrit à la main et rien ne le confrontait au serveur :
      # six types avaient dérivé, le serveur envoyant des champs que le front
      # ne déclarait pas. Rien n'échoue à l'exécution — JSON.parse ignore ce
      # qu'on ne lui demande pas —, le front est seulement aveugle à une partie
      # de ce qu'il reçoit. La référence est l'OpenAPI que l'application
      # publie, déposé par le build du job `test` ; ici, la version commitée
      # suffit, et le script signale si elle a pris du retard.
      - name: Check the hand-written models against the OpenAPI contract
        run: npm run api-types-check

      # Une page qui écrit `'/api/stands/…'` elle-même est une page qu'un
      # renommage de route doit retrouver au grep. Les chemins vivent dans
      # `core/api/`, un service par ressource ; ce cliquet interdit qu'un
      # littéral revienne dans une page déjà migrée, et fait maigrir la liste
      # des fichiers encore tolérés (#392, B3).
      - name: Check that no page writes an API path itself
        run: npm run api-paths-check

      # Et que les adresses de `core/api/` existent : chemin, verbe et
      # paramètres de requête confrontés au contrat OpenAPI. Les specs de page
      # assertaient l'URL exacte avant B3 ; huit services sur onze n'avaient
      # rien pris le relais.
      - name: Check the addresses of core/api against the OpenAPI contract
        run: npm run api-contract-check

      # A class used by a screen is defined in a stylesheet that screen loads:
      # global partial, its own `styleUrl`, or its shell's. The unit tests
      # render without CSS, so nothing else would see a page styled only when
      # another route was visited first.
      - name: CSS scope check
        run: npm run css-scope-check

      # The stores of core/ are read by the pages and written by themselves: a
      # public writable signal is a state nobody owns.
      - name: Read-only stores check
        run: npm run stores-check

      # MatIcon hides its host from assistive tech unless a *static*
      # aria-hidden is in the template, so an icon whose only label is a
      # binding or a tooltip is an icon nobody hears (issue #39). This refuses
      # a new one.
      - name: Icon labels check
        run: npm run icon-labels-check

      # One <h1> per screen, and `mat-card-title` as an attribute rather than
      # an element — the two conventions of docs/developpement.md § a11y that
      # the audit found broken 19 times (issue #43).
      - name: Headings check
        run: npm run headings-check

      # Un cliquet, pas une barrière : la règle s'applique aux **lignes** que la
      # branche écrit, pas au dépôt entier. Le solde — 589 noms et 240 blocs de
      # commentaire, chiffré dans #425 — se paie au fil des passages, sans
      # qu'aucune revue ait à absorber des centaines de renommages mécaniques.
      # Les lignes et non les fichiers : une PR qui renomme dans 130 fichiers ne
      # doit pas devoir traduire au passage ce qu'elle n'a pas écrit.
      - name: Check the language policy on the lines this branch writes
        run: npm run language-policy-modifies -- "origin/${{ github.base_ref || 'main' }}"

      # The production build was only ever exercised by the `test` job, through
      # Quinoa (`./mvnw verify`): a broken template therefore failed in the
      # *backend* job, which made the signal unreadable. It also enforces the
      # bundle budget of angular.json, which nothing else does.
      - name: Build the production bundle
        run: npm run build

      - name: Upload the frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: src/main/webui/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  # Les specs Playwright, hors @lourd. Elles avaient leur workflow ; il les
  # faisait attendre son propre `./mvnw package`, c'est-à-dire une troisième
  # construction du bundle Angular par poussée (audit #392, C9). Un artefact ne
  # se passe pas d'un run à l'autre : reprendre celui du job `test` suppose
  # d'être dans le même run que lui, donc dans ce workflow-ci.
  #
  # Deux conséquences, assumées. Les specs ne démarrent plus en parallèle du
  # backend mais après lui : le retour E2E arrive une vingtaine de minutes plus
  # tard qu'avant, ce qui ne coûte rien là où les jobs font la queue et ce que
  # le build économisé paie ailleurs. Et une suite backend rouge les laisse
  # `skipped` — un `needs` non satisfait —, là où elles auraient pu révéler une
  # panne d'interface sans rapport ; c'est un cycle de retard sur un signal
  # qu'on n'obtient de toute façon qu'après avoir réparé le premier.
  #
  # `e2e-lourd.yml` garde son workflow : son cron nocturne ne suit aucun job
  # `test`, il n'a donc rien à reprendre et construit toujours sa pile.
  e2e:
    # La garde de fork est celle du job `test` : un `needs` insatisfait suffit,
    # puisqu'un job sauté saute tout ce qui en dépend.
    needs: test
    uses: ./.github/workflows/e2e-suite.yml
    with:
      # Tout sauf les specs @lourd — la semaine canicule sur festival-hivernal
      # pesait 13 des 20 minutes de la suite ; elle tourne dans e2e-lourd.yml.
      playwright-args: --grep-invert @lourd
      # Le dernier passage complet sans @lourd tient en ~10 min, montage de la
      # pile compris ; un runner lent a de la marge, un blocage n'en a pas. Le
      # build de l'application n'y est plus, son téléchargement l'a remplacé.
      timeout-minutes: 25
      app-artifact: application-packagee
