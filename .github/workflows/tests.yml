name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `mvn verify`'s package phase runs quarkus:build, which activates
      # Quinoa (only disabled on the %test profile, not on package/verify) —
      # it downloads its own pinned Node binary and runs `npm ci` for the
      # frontend on every run otherwise. Both live outside src/main/webui's
      # node_modules cache-by-lockfile story (the frontend job's own
      # `actions/setup-node` `cache: npm` doesn't apply here: this job never
      # sets up a system Node, Quinoa uses its own isolated one), so they're
      # cached separately, keyed on what actually invalidates each one.
      - name: Cache Quinoa's Node.js binary
        uses: actions/cache@v6
        with:
          path: .quinoa
          key: quinoa-node-${{ runner.os }}-${{ hashFiles('src/main/resources/application.properties') }}

      - name: Cache Quinoa's npm ci output (frontend node_modules)
        uses: actions/cache@v6
        with:
          path: src/main/webui/node_modules
          key: quinoa-node-modules-${{ runner.os }}-${{ hashFiles('src/main/webui/package-lock.json') }}

      # Unit tests, then integration tests (*IT) against the packaged app
      # (skipITs defaults to true in the pom). PostgreSQL is provided by
      # Quarkus dev services (Docker is preinstalled on GitHub runners), so no
      # service container is required here.
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress verify -DskipITs=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    # Self-hosted like every other job: GitHub-hosted minutes are a metered
    # budget, and a runner choice cannot be made dynamic on remaining credits
    # (the job picking the runner would itself need one — see docs/developpement.md).
    runs-on: self-hosted

    defaults:
      run:
        working-directory: src/main/webui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The conventions of this frontend (OnPush everywhere, function-based
      # input()/output(), @for with a track, no `any`) held by discipline alone
      # until now. This is what defends them when someone else contributes.
      - name: Lint
        run: npm run lint

      # Vitest runs in a Node/jsdom environment (no browser needed) and, when
      # not attached to a TTY, executes once and exits instead of watching.
      - name: Run unit tests
        run: npm test

      # Rien d'autre ne voit dériver le catalogue anglais : `$localize` retombe
      # silencieusement sur la source française, donc un écran à moitié traduit
      # ne lève d'erreur ni au build, ni à l'exécution, ni dans les tests — il
      # est simplement à moitié traduit, dans une langue que celui qui l'a
      # écrit ne lit pas. C'est ainsi que 56 identifiants s'étaient accumulés.
      # Le script échoue aussi sur un placeholder divergent, qui casse à
      # l'affichage et en anglais seulement : le plus discret des trois cas.
      - name: Check the English catalogue against the source strings
        run: npm run i18n-check

      # The production build was only ever exercised by the `test` job, through
      # Quinoa (`./mvnw verify`): a broken template therefore failed in the
      # *backend* job, which made the signal unreadable. It also enforces the
      # bundle budget of angular.json, which nothing else does.
      - name: Build the production bundle
        run: npm run build
