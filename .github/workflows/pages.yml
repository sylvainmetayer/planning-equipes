# Publication de la page vitrine (`site/`) sur GitHub Pages.
#
# Déclenchement MANUEL uniquement pour l'instant, volontairement : GitHub Pages
# n'est pas disponible sur un dépôt privé sans compte payant, et ce dépôt est
# privé. Un déclencheur `push` ferait donc échouer le workflow à chaque commit.
#
# À l'ouverture du dépôt public, ajouter :
#
#   push:
#     branches: [main]
#     paths: ['site/**', '.github/workflows/pages.yml']
#
# et activer Pages avec « Source: GitHub Actions » dans les réglages du dépôt.

name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sans plafond, un job pendu brûle six heures de minutes facturées.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
