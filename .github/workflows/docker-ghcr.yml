name: Build and publish Docker image
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# `id-token` and `attestations` are what lets this workflow sign, and publish
# to the repository's attestation store, the provenance and the SBOM of the
# image it just pushed — see the two attest steps at the end of the job.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Syft reads the pushed image rather than the source tree: what has to be
      # inventoried is what actually ships (the JVM layer, the Quarkus app and
      # every jar it bundles), not what a build might have produced.
      - name: Generate the image SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true
          artifact-name: sbom.cyclonedx.json

      # Both attestations are signed with the workflow's OIDC identity and
      # stored on the repository, so anyone can check what a published image is
      # made of and where it came from:
      #   gh attestation verify oci://ghcr.io/<repo>:main --repo <repo>
      #- name: Attest the image provenance
      #  uses: actions/attest-build-provenance@v3
      #  with:
      #    subject-name: ghcr.io/${{ github.repository }}
      #    subject-digest: ${{ steps.build.outputs.digest }}
      #    push-to-registry: true

