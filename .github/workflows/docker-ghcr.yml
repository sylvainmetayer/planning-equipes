name: Build and publish Docker image
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# `id-token` and `attestations` are what lets this workflow sign, and publish
# to the repository's attestation store, the provenance and the SBOM of the
# image it just pushed — see the two attest steps at the end of the job.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    # Publishing the image and its attestations needs no secret held by any
    # particular machine, and running it on a GitHub runner is what makes the
    # provenance verifiable once the repository is public. Every workflow runs
    # there now; this one always did.
    runs-on: ubuntu-latest
    # ~23 min réels tant que l'image se construisait aussi pour arm64 sous
    # QEMU ; sans elle, c'est la moitié. Le plafond reste large : c'est un
    # garde-fou contre un blocage, pas une prévision.
    timeout-minutes: 60

    # The smoke test starts the pushed image against a real PostgreSQL and a
    # Mailpit, as the production stack does. Same images as docker-compose.yml,
    # which Renovate keeps in step; the server major must also match the
    # postgresql-client the Dockerfile installs, which the smoke test checks.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: festival
          POSTGRES_USER: festival
          # No password at all: a throwaway database on the runner, and
          # GitGuardian scans the workflows — nothing here may look like a
          # credential. The application still sends one (generated below),
          # which `trust` ignores.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festival -d festival"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Dockerfile copies this `.git` into the build, where
          # generate-news.js reads it to write the « Nouveautés » screen. At
          # the default depth of 1 that screen would list a single commit —
          # and, on a housekeeping one, would claim no change matches the
          # search rather than admit the history is unreadable. The full
          # history also carries the tags the screen groups releases by.
          fetch-depth: 0

      # Two things have to hold before anything is built, and both fail the
      # job rather than publish something misleading.
      #
      # The checkout of a tag push must leave `git describe --tags
      # --exact-match` working: it is what generate-version.js (frontend
      # APP_VERSION) and the -Drevision derivation in the Dockerfile read.
      # Otherwise a vX.Y.Z image would report a SHA on the Débogage page.
      #
      # And the tag must be strict `vX.Y.Z`. The trigger is `v*`, but the
      # image tags now come from `type=semver`, which merely WARNS on a ref it
      # cannot parse — so a `v1.2` slip would publish an image tagged only
      # `sha-xxxxxxx`, with no tag matching the release, and the job would
      # still be green. Same shape as `tag_pattern` in cliff.toml.
      - name: Check the tag is visible to the build and well formed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          described="$(git describe --tags --exact-match HEAD)"
          test "$described" = "$GITHUB_REF_NAME"
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_REF_NAME n'est pas un tag de release vX.Y.Z : l'image ne porterait aucun tag de version"
            exit 1
          fi

      # Pas de QEMU : l'image ne vise que linux/amd64. Il n'était là que pour
      # émuler arm64, et c'est ce qui coûtait la moitié du job. (Renovate l'a
      # fait passer en v4.3.0 entre-temps : le bump devient sans objet.)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          # The default `latest=auto` moves `:latest` on EVERY tag push — so
          # publishing a 1.2.4 patch after 1.3.0 is out would silently point
          # `:latest` back at the old line. It is set explicitly instead, by
          # the dedicated step below, and only ever moves forward.
          flavor: |
            latest=false

      # Pushed under its `sha-…` tag ONLY. The readable tags (`X.Y.Z`, `X.Y`,
      # `main`) are laid by digest further down, once the image has proven it
      # boots: a broken image stays reachable for diagnosis, it never becomes
      # a release or `:main`.
      - name: Extract the digest-only tag
        id: meta-sha
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          # Une seule cible : aucun déploiement ARM n'existe ni n'est prévu
          # (audit #392, question 3). La construire sous QEMU doublait le job
          # pour un artefact que personne n'exécutait. Pour rétablir arm64 le
          # jour où une machine ARM sert cette image, il faut **deux** gestes :
          # cette ligne, ET l'étape `docker/setup-qemu-action` retirée plus
          # haut. Sans elle, la branche arm64 échoue en `exec format error`
          # au milieu d'une release.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-sha.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The artefact that will be deployed, pulled by digest, started with the
      # minimal production environment: what only the image can break — the
      # JRE layer, uid 1000, the PGDG postgresql-client, the rights on
      # /backup, the ENTRYPOINT, the startup guards (DefaultSecrets,
      # RequiredMentionsLegales, BACKUP_RETENTION bounds) — breaks here,
      # before anything is tagged, signed or attested.
      - name: Smoke test the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          # Generated here rather than written down: nothing in this file is a
          # credential, even a throwaway one.
          db_secret="$(openssl rand -hex 16)"
          admin_password="$(openssl rand -hex 16)"
          session_key="$(openssl rand -hex 16)"
          docker run -d --name smoke --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/festival \
            -e DB_USER=festival -e DB_PASSWORD="$db_secret" \
            -e ADMIN_PASSWORD="$admin_password" \
            -e QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY="$session_key" \
            -e PUBLIC_URL=http://localhost:8080 \
            -e MAIL_MOCK=false -e MAIL_HOST=localhost -e MAIL_PORT=1025 \
            -e MAIL_FROM=smoke@localhost -e MAIL_START_TLS=DISABLED \
            -e LEGAL_DEMO_INSTANCE=true \
            -e BACKUP_DIR=/backup -e BACKUP_RETENTION=3 \
            "$IMAGE"

          # The version the image must report: the Dockerfile's own
          # derivation, word for word, on the same checkout — any tag exactly
          # on HEAD (without its `v`), the short SHA otherwise. Keyed on the
          # event instead, a push to main of a commit already tagged would
          # expect the SHA where the image rightly says the version.
          revision="$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --short HEAD)"
          expected="${revision#v}"
          if ! scripts/verifier-deploiement.sh --attente 180 --instance-demo \
              --env-file /dev/null http://localhost:8080 "$expected"; then
            echo "::error::L'image ne démarre pas ou ne répond pas comme attendu"
            docker logs smoke
            exit 1
          fi

          failed=0
          uid="$(docker exec smoke id -u)"
          if [ "$uid" = 1000 ]; then echo "✔ processus en uid 1000"; else echo "✘ uid $uid au lieu de 1000"; failed=1; fi

          server_major="$(sed -n 's/^[[:space:]]*image: postgres:\([0-9]*\).*/\1/p' docker-compose.prod.yml | head -n1)"
          client_major="$(docker exec smoke pg_dump --version | awk '{print $3}' | cut -d. -f1)"
          if [ -n "$server_major" ] && [ "$client_major" = "$server_major" ]; then
            echo "✔ pg_dump $client_major, comme postgres:$server_major de docker-compose.prod.yml"
          else
            echo "✘ pg_dump $client_major, docker-compose.prod.yml sert postgres:${server_major:-?}"; failed=1
          fi

          if docker exec smoke bash -c 'touch /backup/.smoke && rm /backup/.smoke'; then
            echo "✔ /backup inscriptible"
          else
            echo "✘ /backup n'est pas inscriptible par l'utilisateur de l'image"; failed=1
          fi
          # The old path, still written by an .env.prod from before the rename.
          if docker exec smoke bash -c 'touch /backups/.smoke && test -e /backup/.smoke && rm /backups/.smoke'; then
            echo "✔ /backups mène à /backup"
          else
            echo "✘ /backups, l'ancien chemin, ne mène plus à /backup"; failed=1
          fi

          if [ "$failed" != 0 ]; then
            echo "::error::Le smoke test de l'image a échoué"
            docker logs smoke
            exit 1
          fi

      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f smoke >/dev/null 2>&1 || true

      # Syft reads the pushed image rather than the source tree: what has to be
      # inventoried is what actually ships (the JVM layer, the Quarkus app and
      # every jar it bundles), not what a build might have produced.
      - name: Generate the image SBOM
        id: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true
          artifact-name: sbom.cyclonedx.json
          upload-release-assets: true

      # Signature and SBOM attached to the image itself, in GHCR. This is the
      # path that works today: GitHub's own attestation store (the two steps
      # below) is closed to user-owned private repositories, which is exactly
      # what this repository is.
      #
      # Keyless: the short-lived certificate comes from Fulcio through the
      # workflow's OIDC identity, so there is no key to store or rotate. The
      # counterpart is that the signature is recorded in Rekor, the PUBLIC
      # transparency log — the repository name, the workflow path and the image
      # digest become publicly visible there, even though the repository is
      # private. Nothing of the image content leaks; only these identifiers do.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image and attach its SBOM (cosign, keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cyclonedx.json "$IMAGE"

      # GitHub-side attestations, kept ready rather than commented out: the
      # guard turns them back on by itself the day this repository becomes
      # public (or moves to an organisation), which is the only thing that
      # blocks them. Verification, once enabled:
      #   gh attestation verify oci://ghcr.io/<repo>:main --repo <repo>
      - name: Attest the image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the image SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      # The readable tags, by digest, only now: the image booted (smoke test)
      # and is already signed and attested. A failure from here on leaves a
      # signed image missing a tag — never a tagged image missing its
      # signature. `imagetools create` re-points without rebuilding, so each
      # tag names the exact digest that was tested; re-running is idempotent.
      - name: Tag the validated image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$tag" "$IMAGE"
            echo "✔ $tag"
          done

      # Last on purpose: everything above publishes and then SIGNS the image,
      # and a failure here — a flaky fetch, a registry hiccup on
      # `imagetools create` — must not abort the job between the push and
      # `cosign sign`, which would leave a released, UNSIGNED vX.Y.Z in GHCR.
      # Re-pointing `:latest` is done by digest, so it is order-independent.
      #
      # `:latest` only when the tag being built is the highest stable version
      # of the whole repository — a maintenance patch on an older line must
      # not move it. `imagetools create` re-points the manifest list without
      # rebuilding, so `:latest` is the exact image just pushed.
      #
      # The checkout brings the whole tag list along with the history, but
      # the comparison below is too load-bearing to depend on that setting, so
      # the tags are fetched here anyway. `--prune --prune-tags` keeps it
      # honest should the workspace ever outlive a run (a re-run, a runner that
      # is not disposable): a tag deleted from origin must not linger
      # locally, stay the `newest` for ever and freeze `:latest` — silently,
      # since this step exits 0.
      - name: Point :latest at the newest stable version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --tags --force --prune --prune-tags --quiet origin
          newest="$(git tag --list | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            docker buildx imagetools create \
              --tag "ghcr.io/${{ github.repository }}:latest" \
              "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          else
            echo "::notice::$GITHUB_REF_NAME n'est pas le tag le plus récent ($newest) : :latest ne bouge pas"
          fi
