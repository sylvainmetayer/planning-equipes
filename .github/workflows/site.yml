name: Site

# La vitrine (site/, Eleventy, publiée par Cloudflare Pages) : build, tests,
# orthographe, HTML valide, accessibilité, liens. Rien ici ne touche
# l'application ; le filtre de chemins fait que l'inverse est vrai aussi, à une
# exception : la documentation est publiée par la vitrine sous /docs (les pages
# sont dans site/src/docs/ ; docs/ ne garde que les licences et les diagrammes
# qu'elle affiche), elle la déclenche donc.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - '.pages.yml'
      - '.github/workflows/site.yml'
      - 'src/main/java/dev/sylvain/planning/solver/ConstraintCatalog.java'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - '.pages.yml'
      - '.github/workflows/site.yml'
      - 'src/main/java/dev/sylvain/planning/solver/ConstraintCatalog.java'
  schedule:
    - cron: '0 7 * * 1' # Lighthouse et liens externes, le lundi
  workflow_dispatch:

permissions:
  contents: read

# Une PR annule son run précédent ; une poussée sur main va au bout.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: site

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # dateModified et lastmod se lisent dans l'historique git
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Sans scripts de cycle de vie : rien dans le build n'en a besoin (esbuild et Chromium s'installent par leur paquet)
      - run: npm ci --ignore-scripts
      # Build, puis ses tests : articles contre ConstraintCatalog, structure FR/EN,
      # .pages.yml, liens internes, JSON-LD, hreflang, sitemap
      - run: npm test
      - run: npm run check:spelling
      - run: npm run validate
      - name: Accessibilité (WCAG 2 AA)
        run: npm run check:a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      # Sans le beacon d'audience (build de prévisualisation) : Lighthouse mesure la page,
      # pas un script tiers, et un réseau capricieux ne doit pas faire échouer la PR.
      # Une fois par semaine (et à la demande) : sur une centaine de pages, mobile et
      # bureau, il coûte une demi-heure à chaque PR pour surveiller une pente lente.
      - name: Lighthouse (mobile et bureau, 95 au moins partout)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run build -- --quiet && npm run check:lighthouse
        env:
          ELEVENTY_ENV: preview
          CHROME_PATH: /usr/bin/google-chrome
      - name: Liens
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Hors ligne sauf le lundi : un lien externe cassé ne bloque pas une PR
          args: --config site/lychee.toml ${{ github.event_name != 'schedule' && '--offline' || '' }} --root-dir ${{ github.workspace }}/site/_site 'site/_site/**/*.html'
          fail: true

  # Le contrôle du lundi n'a personne devant l'écran : son échec devient une issue,
  # une seule tant qu'elle reste ouverte (les semaines suivantes la commentent).
  signaler:
    needs: site
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou commenter l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: .
        run: |
          titre="Vérification hebdomadaire du site en échec"
          corps="Le contrôle du lundi (Lighthouse, liens externes) a échoué : $RUN_URL"
          num=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$corps"
          else
            gh issue create --title "$titre" --body "$corps"
          fi
