name: Sécurité

# Ce qu'un scanner trouve tout seul n'a pas à être découvert par un pentest
# facturé à la journée — ni par quelqu'un d'autre une fois l'application sur
# Internet. GitGuardian couvrait déjà les secrets et Renovate les versions,
# mais rien ne regardait les vulnérabilités connues des dépendances.
#
# L'analyse statique du code revient à Semgrep OSS et non à CodeQL : ce dernier
# ne sait publier ses résultats que dans l'onglet Security, ce qui suppose le
# *code scanning* — payant sur un dépôt privé, ce qu'est celui-ci. Semgrep, lui,
# ne demande rien à GitHub : il échoue dans le log, comme le scan de
# dépendances.
#
# Le rendez-vous hebdomadaire compte autant que le déclenchement sur PR : une
# CVE publiée demain touche un `pom.xml` qui n'a pas bougé.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Lundi 5 h UTC, hors des heures d'usage.
    - cron: '0 5 * * 1'
  workflow_dispatch:

# Le job ne publie rien côté GitHub : il lit les sources et échoue s'il trouve.
permissions:
  contents: read

concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependances:
    name: Vulnérabilités des dépendances
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lit `pom.xml` et `src/main/webui/package-lock.json` : les deux
      # écosystèmes du projet en une passe, sans clé d'API (contrairement à
      # OWASP dependency-check, que la limitation de débit du NVD rend pénible
      # en CI).
      # Le job EST la barrière : `exit-code: 1` le fait échouer sur la moindre
      # vulnérabilité corrigeable, et le tableau part dans le log. Publier
      # plutôt un SARIF dans l'onglet Security supposerait le *code scanning*,
      # indisponible ici (voir l'en-tête) — et une analyse dont le résultat
      # n'atteint personne ne sert à rien.
      - name: Scan des dépendances (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Une vulnérabilité sans correctif disponible n'est pas une action :
          # elle ferait échouer chaque PR sans que personne ne puisse rien y
          # faire.
          ignore-unfixed: true

  code:
    name: Analyse statique du code (Semgrep)
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Semgrep tourne dans son image officielle plutôt qu'installé par pip :
      # `actions/setup-python` ne trouve aucun binaire pour la distribution du
      # runner (« The version '3.13' with architecture 'x64' was not found for
      # debian 13 »), et un `pip install` dans le Python système se heurterait à
      # PEP 668. Docker est de toute façon déjà requis par docker-ghcr.yml.
      #
      # Le dépôt est monté en LECTURE SEULE : Semgrep n'a rien à y écrire, et un
      # fichier laissé par le conteneur — donc appartenant à root — ferait
      # échouer le `git clean` du job suivant.
      #
      # Version épinglée comme le reste de la chaîne d'outils : une montée peut
      # ajouter des règles, et donc faire rougir une PR qui n'a rien changé.
      # Une image citée dans un `run:` échappe au gestionnaire `github-actions`
      # de Renovate ; elle est donc sortie dans `env:` sous l'annotation que le
      # gestionnaire `custom.regex` reconnaît (voir `renovate.json`). La PR de
      # montée reste à lire — elle dit ce que la nouvelle version trouve en plus.
      #
      # Six jeux de règles du registre, choisis sur ce que le dépôt contient
      # réellement : les deux langages, le classement OWASP qui les traverse, le
      # Dockerfile — dont l'utilisateur non privilégié fait précisément partie de
      # ce que ces règles vérifient —, les workflows, où se joue le risque de
      # chaîne d'approvisionnement (action repointée sous un tag mutable), et la
      # configuration d'agent que `.claude/` publie : hooks, skills, settings.
      # Trois familles de ce dernier jeu peuvent trouver ici (`hooks-*`,
      # `claude-settings-*`, `skill-md-*`) ; les règles MCP ne visent que Python
      # et TypeScript, donc pas notre serveur MCP en Java.
      #
      # `--severity INFO` : tous les niveaux remontent. Le cran avait été laissé
      # à ERROR le temps d'assainir la base ; elle l'est, et un avertissement
      # qu'on ne voit pas ne protège de rien.
      #
      # Semgrep saute de lui-même ce que `.gitignore` couvre (`target/`,
      # `node_modules/`, `dist/`), donc rien à exclure à la main. `--metrics off`
      # coupe la télémétrie anonyme envoyée par défaut lors de la récupération
      # des règles.
      - name: Scanner les sources
        env:
          # renovate: datasource=docker depName=semgrep/semgrep
          SEMGREP_IMAGE: semgrep/semgrep:1.174.0
        run: |
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --workdir /src \
            --env HOME=/tmp \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/java \
              --config p/typescript \
              --config p/owasp-top-ten \
              --config p/dockerfile \
              --config p/github-actions \
              --config r/ai.ai-best-practices \
              --severity INFO \
              --metrics off \
              --error
