# L'inventaire des licences tierces, régénéré sur les PR Renovate.
#
# `docs/licences-tierces.md` est un fichier généré que le job `test` compare à
# ce que le dépôt produit : un bump Maven ou npm le fait échouer par
# construction, et huit PR Renovate ont été rouges d'un coup pour cette seule
# raison — un verdict connu d'avance, obtenu après treize minutes de tests.
# Renovate saurait le faire lui-même (`postUpgradeTasks`), mais seulement
# auto-hébergé. Ici, ce job régénère le fichier et le commite sur la branche.
#
# Deux pièges, tous deux tenus :
#   - une poussée faite avec GITHUB_TOKEN ne déclenche aucun workflow, sauf
#     `workflow_dispatch` : le job relance donc lui-même les workflows de la
#     PR sur la branche, et annule ceux qui tournaient encore sur le commit
#     que sa poussée vient de remplacer ;
#   - Renovate cesse de mettre à jour une branche que quelqu'un d'autre a
#     touchée : `gitIgnoredAuthors` de renovate.json lui dit d'ignorer cet
#     auteur-ci, et une rebase de sa part recrée la branche sans ce commit,
#     que ce job repose alors.
#
# Deux jobs plutôt qu'un, et c'est le point de sécurité du fichier : la
# régénération lance `./mvnw license:add-third-party`, donc des plugins Maven
# dont la version vient du `pom.xml` non relu de la PR — que le groupe
# « maven build plugins » de Renovate peut justement faire bouger. Ce job-là
# n'a que `contents: read`. Le jeton capable d'écrire sur la branche et de
# piloter les workflows reste dans le second, qui ne fait tourner que git et
# gh sur un fichier déjà produit.
name: Licences tierces

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/main/webui/package-lock.json'

permissions:
  contents: read

concurrency:
  group: licences-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerer:
    # Renovate seulement, et depuis ce dépôt : un humain qui bump une
    # dépendance régénère le fichier lui-même, comme la doc le dit.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Le build tourne sans jeton d'écriture : voir l'en-tête.
    permissions:
      contents: read
    outputs:
      change: ${{ steps.diff.outputs.change }}

    steps:
      - name: Checkout the branch of the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La branche elle-même, pas le commit de fusion que `pull_request`
          # extrait par défaut : c'est là que le commit doit aller.
          ref: ${{ github.head_ref }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Les deux générateurs, dans l'ordre que docs/developpement.md prescrit :
      # Maven résout le côté Java, le script lit le verrou npm sans
      # node_modules — `node` est préinstallé sur le runner.
      - name: Regenerate the inventory
        run: |
          ./mvnw -B --no-transfer-progress license:add-third-party
          node src/main/webui/scripts/licences-tierces.js

      # Le plus souvent l'inventaire ne bouge pas : le dire ici évite
      # d'allumer le job privilégié pour rien.
      - name: Note whether the inventory moved
        id: diff
        run: |
          if git diff --quiet -- docs/licences-tierces.md; then
            echo "L'inventaire est déjà celui de ces dépendances."
            echo 'change=false' >> "$GITHUB_OUTPUT"
          else
            echo 'change=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the inventory to the committing job
        if: steps.diff.outputs.change == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licences-tierces
          path: docs/licences-tierces.md

  commiter:
    needs: regenerer
    if: needs.regenerer.outputs.change == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Les seuls droits d'écriture du workflow, et ils ne voient aucun build :
    # `contents` pour la poussée, `actions` pour l'annulation et la relance.
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout the branch of the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      # `gh run download` plutôt que download-artifact : le job a déjà le
      # jeton et les droits `actions`, et l'artefact du run courant s'y
      # récupère tel quel. Le fichier atterrit à sa place dans `docs/`.
      - name: Retrieve the regenerated inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name licences-tierces --dir docs

      - name: Commit the inventory and replay the checks on it
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          SUPERSEDED_SHA: ${{ github.event.pull_request.head.sha }}
          SOLVER_BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'timefold') || contains(github.event.pull_request.labels.*.name, 'quarkus') }}
        run: |
          # Le job précédent a vu le fichier bouger, mais il a extrait la
          # branche avant lui : si Renovate l'a rebasée entre-temps, la tête
          # d'ici porte peut-être déjà le bon inventaire.
          if git diff --quiet -- docs/licences-tierces.md; then
            echo "L'inventaire est déjà celui de ces dépendances."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(deps): régénérer l'inventaire des licences tierces" -- docs/licences-tierces.md

          # Une poussée simple, jamais forcée : si Renovate a rebasé la branche
          # pendant la régénération, le refus est la bonne issue — forcer
          # écraserait sa rebase. Ce run s'arrête alors proprement, et celui
          # que la rebase vient de déclencher reposera ce commit sur la
          # nouvelle tête. Sans ce garde-fou, `bash -e` tuait le script ici :
          # ni l'annulation ni la relance ci-dessous ne tournaient.
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning::Poussée refusée : $BRANCH a bougé pendant la régénération (rebase Renovate ?). Le run déclenché par cette nouvelle tête reprendra l'inventaire."
            exit 0
          fi

          # Ce qui tournait encore sur le commit remplacé ne prouve plus rien.
          for wf in tests.yml e2e.yml e2e-lourd.yml securite.yml scenario-tests.yml; do
            for status in in_progress queued; do
              gh run list --workflow "$wf" --commit "$SUPERSEDED_SHA" --status "$status" \
                --json databaseId --jq '.[].databaseId' \
                | xargs -r -n1 gh run cancel || true
            done
          done

          for wf in tests.yml e2e.yml securite.yml; do
            gh workflow run "$wf" --ref "$BRANCH"
          done
          # Les deux workflows lourds ont `pom.xml` dans leurs chemins et la
          # même garde de label : on ne les relance que là où ils auraient
          # tourné d'eux-mêmes.
          if [ "$SOLVER_BUMP" = "true" ]; then
            gh workflow run scenario-tests.yml --ref "$BRANCH"
            gh workflow run e2e-lourd.yml --ref "$BRANCH"
          fi
