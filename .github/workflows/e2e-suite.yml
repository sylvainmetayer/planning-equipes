# La pile E2E — application packagée, PostgreSQL, Mailpit, Keycloak, Chromium —
# montée pour une exécution et jetée. Une seule description de la pile, ou les
# appelants dérivent ; ils ne diffèrent que par la sélection Playwright, le
# plafond et les portes d'authentification ouvertes (`authentification`) :
#
#   keycloak-secours  Keycloak + compte de secours ouvert. La suite principale
#                     (e2e.yml, job `e2e`) : l'administration s'y connecte par
#                     le formulaire de secours, l'espace animateur par Keycloak.
#   keycloak          Keycloak seul, secours fermé : la production. La suite
#                     playwright.oidc.config.ts (e2e.yml, job `e2e-keycloak`).
#   secours           Ni Keycloak ni espace : OIDC_ENABLED=false. Pour une
#                     sélection qui n'ouvre aucun espace animateur — les specs
#                     @lourd (e2e-lourd.yml), qui s'épargnent ainsi l'image.
name: Pile E2E

on:
  workflow_call:
    inputs:
      playwright-args:
        description: 'Arguments passés à `playwright test` — la sélection (--grep / --grep-invert).'
        type: string
        required: true
      timeout-minutes:
        description: 'Plafond du job, en minutes.'
        type: number
        required: true
      horloge-simulee:
        description: >-
          Monte l'application avec HORLOGE_SIMULEE_AUTORISEE=true : la page
          Débogage peut figer la date du serveur, comme sur une recette.
        type: boolean
        default: false
      authentification:
        description: >-
          Portes ouvertes sur la pile : `keycloak-secours`, `keycloak` ou
          `secours` (voir l'en-tête). Décide aussi de la configuration
          Playwright jouée.
        type: string
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Le plafond est celui de l'appelant : ~10 min pour la suite ordinaire,
    # bien plus pour les specs @lourd. Un vrai blocage se voit toujours — un
    # spec qui n'avance plus est coupé par son propre budget bien avant.
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # Sur le runner hôte, pas dans l'image Playwright : Keycloak se lance ici
    # par `docker run`, après le checkout — son realm et son image sont des
    # fichiers du dépôt, qu'un `services:` (démarré AVANT le checkout) ne
    # verrait pas —, et l'image Playwright ne porte pas le client Docker. Le
    # navigateur s'installe donc plus bas, avec ses bibliothèques système.
    #
    # Second mérite : application et navigateur tournent tous deux sur l'hôte,
    # donc « http://localhost:8081 » désigne le même Keycloak des deux côtés.
    # L'émetteur des jetons est cohérent sans rien ajouter à /etc/hosts.

    # Pile jetable, montée pour cette exécution seule. La suite écrase la base
    # via `/api/database/import` : elle ne doit jamais viser autre chose que
    # ces conteneurs-là.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: festival
          POSTGRES_USER: festival
          POSTGRES_PASSWORD: e2e-db-Xq7mR2vL
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festival"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          # 1025 = SMTP, par où l'application (et Keycloak, sous le nom
          # `mailpit`) dépose. 8025 = l'API REST, par où les specs comptent
          # les courriels reçus et vident la boîte entre deux passes.
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      # L'image est celle du dépôt, pas l'officielle : docker/keycloak/Dockerfile
      # y ajoute l'authentificateur « code par e-mail » et le thème, et c'est
      # elle que la production déploie. La construire ici prouve qu'elle
      # démarre. Le cache GitHub Actions rend l'extension Maven presque
      # gratuite d'une exécution à l'autre.
      - name: Set up Docker Buildx
        if: inputs.authentification != 'secours'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Les images de base (quay.io, Docker Hub) se tirent pendant la
      # construction, et un registre qui hoquette faisait tomber toute la
      # suite sur une erreur réseau. D'où une seconde tentative, trente
      # secondes plus tard, plutôt qu'un échec rouge sans rapport avec le code.
      - name: Build the Keycloak image (extension and theme)
        id: keycloak-image
        if: inputs.authentification != 'secours'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/keycloak/Dockerfile
          load: true
          tags: planning-equipes-keycloak:ci
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Wait before retrying the Keycloak image
        if: inputs.authentification != 'secours' && steps.keycloak-image.outcome == 'failure'
        run: sleep 30

      - name: Build the Keycloak image (second attempt)
        if: inputs.authentification != 'secours' && steps.keycloak-image.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/keycloak/Dockerfile
          load: true
          tags: planning-equipes-keycloak:ci
          cache-from: type=gha,scope=keycloak

      # Store embarqué de `start-dev` : aucune base à côté, la pile étant
      # jetable. Sur le réseau des services, sous le nom `keycloak`, pour que
      # le realm joigne Mailpit par son nom `mailpit` (son `smtpServer`) ; le
      # port publié sert l'hôte, où tournent l'application et le navigateur.
      - name: Start Keycloak with the planning realm
        if: inputs.authentification != 'secours'
        run: |
          docker run -d --name keycloak \
            --network "${{ job.services.postgres.network }}" --network-alias keycloak \
            -p 8081:8081 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=e2e-keycloak-Wq2fT7xM \
            -e KC_HOSTNAME=http://localhost:8081 \
            -e KC_HOSTNAME_STRICT=false \
            -e KC_HTTP_ENABLED=true \
            -e KC_HEALTH_ENABLED=true \
            -v "$GITHUB_WORKSPACE/docker/keycloak/realm-planning.json:/opt/keycloak/data/import/realm-planning.json:ro" \
            planning-equipes-keycloak:ci \
            start-dev --import-realm --http-port=8081
          # La découverte OIDC, pas le port : un realm mal importé laisse le
          # serveur répondre et l'application échouer une minute plus tard.
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8081/realms/planning/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak prêt, realm planning importé."
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak n'a pas importé son realm en 180 s :"
          docker logs keycloak | tail -n 200
          exit 1

      # Quinoa construit le frontend pendant le package : l'application servie
      # est donc exactement celle qu'un déploiement sert, pas un `ng serve`.
      - name: Build the application
        run: ./mvnw -B --no-transfer-progress package -DskipTests

      - name: Install frontend dependencies
        working-directory: src/main/webui
        run: npm ci

      # Le job ne tourne pas dans l'image Playwright : le navigateur et ses
      # bibliothèques système s'installent ici, à la version que fixe
      # package-lock.json.
      - name: Install the browser
        working-directory: src/main/webui
        run: npx playwright install --with-deps chromium

      - name: Start the application
        env:
          DB_URL: jdbc:postgresql://localhost:5432/festival
          DB_USER: festival
          DB_PASSWORD: e2e-db-Xq7mR2vL
          HTTP_PORT: 8080
          # Pas la valeur d'exemple : DefaultSecrets refuse le boot dessus, et
          # ce job lance le jar packagé, donc en LaunchMode production.
          ADMIN_PASSWORD: e2e-admin-Kd9nT4wB
          # Même raison, autre garde : RequiredMentionsLegales refuse une page
          # de mentions légales vide en production. Un harnais de test est
          # exactement l'instance « pas en service » que ce drapeau déclare —
          # remplir cinq variables légales fictives dirait le contraire.
          LEGAL_DEMO_INSTANCE: 'true'
          # « Le passé est figé » (ADR 0044) reste à sa valeur par défaut,
          # celle de la production : les specs datent leurs amorces plusieurs
          # semaines après l'horloge réelle (`shiftDate`, e2e/support.ts), si
          # bien qu'aucun de leurs créneaux n'est encore commencé.
          #
          # L'horloge simulée, elle, reste refusée sur la pile ordinaire —
          # jour-j.spec.ts vérifie ce refus. Seul l'appelant qui joue la spec
          # du passé figé l'autorise.
          HORLOGE_SIMULEE_AUTORISEE: ${{ inputs.horloge-simulee }}
          # Le glisser-déposer est coupé par défaut ; la pile E2E l'active pour
          # que glisser-deposer.spec.ts continue d'exercer le geste, et que
          # passe-fige.spec.ts voie ce même geste refusé sur une journée passée.
          GLISSER_DEPOSER_ACTIF: 'true'
          MAIL_MOCK: 'false'
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          MAIL_FROM: planning-equipes@localhost
          PUBLIC_URL: http://localhost:8080
          # Les portes, dites explicitement dans les deux sens : la production
          # ouvre Keycloak et ferme le secours par défaut, une pile de test ne
          # doit hériter d'aucun des deux sans l'avoir choisi.
          OIDC_ENABLED: ${{ inputs.authentification != 'secours' }}
          ADMIN_SECOURS_ENABLED: ${{ inputs.authentification != 'keycloak' }}
          # La même URL que celle du navigateur : c'est ce qui rend l'émetteur
          # des jetons cohérent. Secrets de développement du realm importé.
          OIDC_AUTH_SERVER_URL: http://localhost:8081/realms/planning
          OIDC_CLIENT_ID: planning-app
          OIDC_CLIENT_SECRET: dev-planning-app-oJ4kQ2vT-8fW6nB3q
          # Le provisioning n'est allumé que sur la pile de production, dont la
          # suite l'éprouve. Sur la suite principale, les fiches s'amorcent par
          # import SQL, qui ne provisionne personne : e2e/keycloak.ts prépare
          # lui-même les comptes des animateurs qu'elle connecte.
          OIDC_PROVISIONING_ENABLED: ${{ inputs.authentification == 'keycloak' }}
          OIDC_PROVISIONING_SERVER_URL: http://localhost:8081
          OIDC_PROVISIONING_CLIENT_ID: planning-provisioning
          OIDC_PROVISIONING_CLIENT_SECRET: dev-planning-provisioning-yH5mL8sK
        run: |
          java -jar target/quarkus-app/quarkus-run.jar > app.log 2>&1 &
          echo $! > app.pid
          # La sonde de disponibilité dit que l'application répond vraiment —
          # base joignable, migrations passées —, et pas seulement que le port
          # est ouvert.
          # `curl` est présent dans l'image Playwright ; s'il venait à
          # disparaître, l'attente échouerait avant l'application.
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/q/health/ready > /dev/null; then
              echo "Application prête."
              exit 0
            fi
            sleep 2
          done
          echo "L'application n'a pas répondu en 120 s :"
          cat app.log
          exit 1

      - name: Run the Playwright suite
        working-directory: src/main/webui
        env:
          # Tout tourne sur l'hôte, services publiés compris : localhost.
          E2E_BASE_URL: http://localhost:8080
          E2E_MAILPIT_URL: http://localhost:8025
          E2E_ADMIN_PASSWORD: e2e-admin-Kd9nT4wB
          E2E_KEYCLOAK_URL: http://localhost:8081
          E2E_KEYCLOAK_ADMIN: admin
          E2E_KEYCLOAK_ADMIN_PASSWORD: e2e-keycloak-Wq2fT7xM
          # La pile de production (secours fermé) joue sa propre configuration,
          # sans le globalSetup qui se connecte par le formulaire de secours.
          E2E_SCRIPT: ${{ inputs.authentification == 'keycloak' && 'e2e:oidc' || 'e2e' }}
        run: npm run "$E2E_SCRIPT" -- ${{ inputs.playwright-args }}

      # Ce qu'un échec a sous les yeux, lisible dans le journal du job sans
      # télécharger l'artefact : la photographie de la page que Playwright
      # joint à chaque échec, et les erreurs que l'application a journalisées.
      - name: Print the failure context
        if: failure()
        run: |
          for contexte in $(find src/main/webui/test-results -name error-context.md 2>/dev/null); do
            echo "::group::$contexte"
            head -n 250 "$contexte"
            echo "::endgroup::"
          done
          if [ -f app.log ]; then
            echo "::group::app.log — ERROR/WARN"
            grep -nE "ERROR|WARN|Exception" app.log | tail -n 200 || true
            echo "::endgroup::"
          fi
          if docker inspect keycloak > /dev/null 2>&1; then
            echo "::group::keycloak"
            docker logs keycloak 2>&1 | tail -n 200
            echo "::endgroup::"
          fi

      # Les traces ne sont conservées qu'en cas d'échec (`trace:
      # 'retain-on-failure'`), donc cet artefact est vide quand tout va bien.
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Suffixé : e2e.yml appelle cette pile deux fois dans un même run, et
          # deux artefacts du même nom s'y refusent.
          name: playwright-traces-${{ inputs.authentification }}
          path: src/main/webui/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      # Un échec se relit sans la pile : le journal de l'application est la
      # moitié de l'histoire que les traces ne disent pas.
      - name: Upload the application log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-log-${{ inputs.authentification }}
          path: app.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
          docker rm -f keycloak 2>/dev/null || true
