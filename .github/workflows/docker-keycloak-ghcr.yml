name: Build and publish the Keycloak image
# The repository's Keycloak image — the official one, plus the e-mail code
# authenticator and the « planning » theme (docker/keycloak/Dockerfile). Same
# policy as docker-ghcr.yml for the application: `:main` on every merge that
# touches it, `1.2.0` and `1.2` on a `vX.Y.Z` tag, `:latest` only on the newest
# stable tag, a CycloneDX SBOM and a keyless cosign signature. Both images
# therefore carry the same version numbers: a deployment names ONE version for
# the two (docker-compose.prod.yml reuses APP_VERSION).
#
# On `main`, it runs only when something that goes into the image changed —
# the theme, the extension, this Dockerfile, this workflow. A tag always
# publishes it: GitHub does not evaluate `paths` on a tag push, which is the
# wanted behaviour, a release must exist for both images.
on:
  push:
    branches:
      - main
    paths:
      - 'docker/keycloak/**'
      - 'keycloak/**'
      - '.github/workflows/docker-keycloak-ghcr.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# `contents: write` only for the SBOM uploaded as a release asset, as in
# docker-ghcr.yml; `id-token` and `attestations` are what lets this workflow
# sign the image it just pushed and publish its provenance and SBOM.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-keycloak-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  # Named after the product, not the repository, next to the application image
  # docker-compose.prod.yml expects under ghcr.io/sylvainmetayer/planning-equipes.
  IMAGE: ghcr.io/${{ github.repository_owner }}/planning-equipes-keycloak

jobs:
  docker:
    runs-on: ubuntu-latest
    # The extension is a Maven module of a few files and the theme is static:
    # a few minutes. The ceiling is a guard against a hang, not a forecast.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same guard as for the application: a tag that is not a strict vX.Y.Z
      # would publish an image tagged only `sha-xxxxxxx`, with nothing matching
      # the release, and the job would stay green.
      - name: Check the tag is well formed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_REF_NAME n'est pas un tag de release vX.Y.Z : l'image ne porterait aucun tag de version"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          # `:latest` is set by the dedicated step at the end, and only when
          # the pushed tag is the newest stable one — see docker-ghcr.yml.
          flavor: |
            latest=false

      - name: Build and push the Keycloak image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/keycloak/Dockerfile
          # One target, like the application image (audit #392, question 3).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A scope of its own: without it this build and the application's
          # would evict each other's layers from the shared GHA cache.
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Generate the image SBOM
        id: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-keycloak.cyclonedx.json
          upload-artifact: true
          artifact-name: sbom-keycloak.cyclonedx.json
          upload-release-assets: true

      # Keyless, as for the application: see docker-ghcr.yml for what the
      # public transparency log makes visible (the repository name, the
      # workflow path and the digest — nothing of the content).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image and attach its SBOM (cosign, keyless)
        env:
          SUBJECT: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$SUBJECT"
          cosign attest --yes --type cyclonedx --predicate sbom-keycloak.cyclonedx.json "$SUBJECT"

      - name: Attest the image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the image SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-keycloak.cyclonedx.json
          push-to-registry: true

      # Last on purpose, and by digest: a failure here must not abort the job
      # between the push and `cosign sign` — see docker-ghcr.yml for the why,
      # and for the tag fetch that keeps the comparison honest.
      - name: Point :latest at the newest stable version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --tags --force --prune --prune-tags --quiet origin
          newest="$(git tag --list | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "${IMAGE}@${{ steps.build.outputs.digest }}"
          else
            echo "::notice::$GITHUB_REF_NAME n'est pas le tag le plus récent ($newest) : :latest ne bouge pas"
          fi
