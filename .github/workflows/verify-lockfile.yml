# Échoue si .github/workflows/actions.lock ne correspond plus aux workflows
# ou si un commit verrouillé n'existe plus en amont.
# Régénérer à la main : gh actions-lock --no-narrow (sans --no-narrow, l'outil
# réécrit les SHA en tags). Voir site/src/docs/comprendre/ci-et-livraison.md (le verrou des actions).
name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Une PR annule son run précédent ; une poussée sur main va au bout.
concurrency:
  group: verify-lockfile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.1
      - run: gh actions-lock --verify
