# Tests de scénario grande échelle, lancés ponctuellement.
#
# Les tests `scenario-lent` résolvent de gros scénarios jusqu'à la faisabilité
# et affirment un score dur nul. Trop lents pour le workflow Tests qui tourne
# sur chaque push, ils sont exclus par défaut (voir `test.excludedGroups` dans
# le pom).
#
# PlanningServiceScenarioCompletTest et PlanningServiceScenarioContinuTest
# portent sur des scénarios construits à la main : réguliers, sans stand
# premium, avec peu d'exceptions d'ouverture.
# PlanningServiceScenarioFestivalRealisteTest porte sur les deux fixtures
# anonymisées issues du réel — 45 stands premium, horaires récurrents avec
# coupure méridienne, matrice de compétences irrégulière — et c'est là que la
# convergence a historiquement cassé sans qu'aucun scénario fabriqué ne le
# voie. Il pèse l'essentiel de la durée du job.
#
# Ils sont pourtant le seul filet contre une régression de convergence, et
# rien ne les déclenchait : un réglage du solveur pouvait partir en production
# sans que personne ne vérifie qu'un scénario connu converge encore. Ce
# workflow comble ce trou en les lançant sur les seuls changements qui peuvent
# les casser — ce que le solveur résout, ou la façon dont il cherche.
name: Tests de scénario

on:
  pull_request:
    # Liste dupliquee ci-dessous pour le push : GitHub Actions n'interprete pas
    # les ancres YAML.
    paths:
      - 'src/main/java/dev/sylvain/planning/solver/**'
      - 'src/main/java/dev/sylvain/planning/domain/**'
      - 'src/main/resources/solver/solverConfig.xml'
      - 'src/main/resources/application.properties'
      - 'src/main/resources/scenarios/**'
      - 'src/test/java/dev/sylvain/planning/service/solve/PlanningServiceScenario*Test.java'
      - 'src/test/java/dev/sylvain/planning/service/EmptyReferenceData.java'
      # Le test phare appelle en direct les classes de service/solve — de
      # PlanningService à VacationGeneratorService, qui fabrique les vacations
      # soumises au solveur —, qui décident de la taille du problème ou de sa
      # construction. Le paquet entier plutôt que six fichiers nommés à la main :
      # VacationGeneratorService manquait à la liste, et une régression de
      # convergence y partait sans qu'aucun job ne la voie.
      - 'src/main/java/dev/sylvain/planning/service/solve/**'
      - 'src/main/java/dev/sylvain/planning/service/referentiel/HoraireStandResolver.java'
      - 'src/main/java/dev/sylvain/planning/service/scenario/ScenarioYamlReader.java'
      - 'src/main/java/dev/sylvain/planning/scenario/**'
      # Une montée de version Timefold est précisément le moment où l'on veut
      # savoir si les scénarios connus convergent toujours.
      - 'pom.xml'
      - '.github/workflows/scenario-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/java/dev/sylvain/planning/solver/**'
      - 'src/main/java/dev/sylvain/planning/domain/**'
      - 'src/main/resources/solver/solverConfig.xml'
      - 'src/main/resources/application.properties'
      - 'src/main/resources/scenarios/**'
      - 'src/test/java/dev/sylvain/planning/service/solve/PlanningServiceScenario*Test.java'
      - 'src/test/java/dev/sylvain/planning/service/EmptyReferenceData.java'
      # Le test phare appelle en direct les classes de service/solve — de
      # PlanningService à VacationGeneratorService, qui fabrique les vacations
      # soumises au solveur —, qui décident de la taille du problème ou de sa
      # construction. Le paquet entier plutôt que six fichiers nommés à la main :
      # VacationGeneratorService manquait à la liste, et une régression de
      # convergence y partait sans qu'aucun job ne la voie.
      - 'src/main/java/dev/sylvain/planning/service/solve/**'
      - 'src/main/java/dev/sylvain/planning/service/referentiel/HoraireStandResolver.java'
      - 'src/main/java/dev/sylvain/planning/service/scenario/ScenarioYamlReader.java'
      - 'src/main/java/dev/sylvain/planning/scenario/**'
      - 'pom.xml'
      - '.github/workflows/scenario-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenario-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    # Même garde de fork que tests.yml, conservée pour la même raison.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Ces scénarios résolvent jusqu'à la faisabilité dure, avec des budgets de
    # 480 s à 900 s par test. Un runner GitHub est plus lent que la machine de
    # développement : la marge est là pour ça, et un solve parti en boucle
    # s'arrête ici plutôt que de consommer six heures facturées.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `test` et non `verify` : ces tests sont du Java simple, sans Quarkus ni
      # base de données, donc rien à packager — et donc pas de Quinoa à
      # réveiller, contrairement au workflow Tests.
      # Le profil `scenario-tests` lève l'exclusion du tag ; `-Dtest` limite le
      # run aux trois classes concernées, le reste de la suite étant déjà
      # couvert par le workflow Tests.
      #
      # PlanningServiceScenarioFestivalRealisteTest est le seul des trois à
      # porter sur des données réelles, et donc sur des stands à horaires
      # récurrents. Il converge en ~150 s et ~10 s ; son plafond de sécurité de
      # 900 s ne borne qu'un run qui ne converge pas.
      - name: Run the large-scenario tests
        run: >-
          ./mvnw -B --no-transfer-progress test -Pscenario-tests
          -Dtest='PlanningServiceScenarioCompletTest,PlanningServiceScenarioContinuTest,PlanningServiceScenarioFestivalRealisteTest'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
