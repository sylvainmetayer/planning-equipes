name: Tests de mutation

# PIT modifie le bytecode des contraintes du solveur — une comparaison
# inversée, un `>` devenu `>=`, une pénalité rendue nulle — et rejoue les
# tests `ConstraintVerifier` sur chaque mutant. Un mutant qui survit est une
# règle dont aucun test ne remarque qu'elle a changé : la couverture JaCoCo
# disait seulement que la ligne avait tourné.
#
# Chaque nuit sur `main`, plus jamais sur une PR : six PR en parallèle
# saturaient la limite de jobs simultanés, et la mesure bouge peu d'une PR à
# l'autre. Avant de pousser une contrainte, la commande se lance en local
# (environ 4 min) ou d'ici par `workflow_dispatch`. Sous `mutationThreshold`
# (pom.xml, profil `mutation`), le job échoue et le job `signaler` ouvre une
# issue ; le rapport HTML dit quels mutants ont survécu, ligne par ligne.

on:
  schedule:
    # 1 h UTC, avant les runs nocturnes de 3 h (e2e-lourd, oidc-keycloak).
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pit:
    name: Mutation des contraintes (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `test-compile` et non `package` : PIT ne lit que les classes et les
      # tests compilés, et Quinoa (le bundle Angular) n'a rien à faire ici.
      - name: Run PIT
        run: ./mvnw -B --no-transfer-progress -Pmutation test-compile pitest:mutationCoverage

      - name: Upload the mutation report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-reports
          path: target/pit-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # Le run de la nuit n'a personne devant l'écran : son échec devient une
  # issue, une seule tant qu'elle reste ouverte (les nuits suivantes la
  # commentent). Même recette que le job `signaler` de site.yml.
  signaler:
    needs: pit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou commenter l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titre="Tests de mutation nocturnes (PIT) en échec"
          corps="Le run PIT de la nuit a échoué (seuil de mutation ou build) : $RUN_URL"
          num=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$corps"
          else
            gh issue create --title "$titre" --body "$corps"
          fi
