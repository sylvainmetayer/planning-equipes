# Pile de production, à ne pas confondre avec `docker-compose.yml`, qui est une
# pile de DÉVELOPPEMENT : celle-ci publie PostgreSQL sur l'hôte, ajoute pgAdmin
# en `admin/admin` sans mode serveur et un puits SMTP qui n'envoie rien — trois
# choses qui n'ont pas à exister sur une machine exposée.
#
# Ici, un seul port est publié, et encore : sur la boucle locale, parce que
# c'est le reverse proxy qui termine le TLS et qui doit être le seul chemin
# vers l'application (voir docs/securite.md § Déploiement).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Tout ce qui est repris de l'environnement est OBLIGATOIRE et sans valeur par
# défaut : un `?` fait échouer le démarrage plutôt que de laisser passer un
# mot de passe de développement en production.

services:
  app:
    # Une version NOMMÉE (APP_VERSION=1.2.0), jamais `main` ni `latest` : un
    # déploiement doit être nommable dans un rapport d'incident. Sans défaut,
    # comme les mots de passe. Voir docs/versioning.md § Déployer.
    image: ghcr.io/sylvainmetayer/planning-equipes:${APP_VERSION:?APP_VERSION est obligatoire — une version nommée, ex. 1.2.0, voir docs/versioning.md}
    restart: unless-stopped
    mem_limit: 1g
    # Sur la boucle locale seulement : le reverse proxy est le seul chemin
    # d'entrée, et l'origine ne doit pas être joignable sans passer par lui —
    # c'est ce qui rend dignes de confiance les en-têtes X-Forwarded-*.
    #
    # Le port 9000 (interface de management : les métriques Prometheus,
    # /q/metrics) n'est volontairement PAS publié : il n'a pas
    # d'authentification, sa seule protection est de n'être joignable que du
    # réseau interne de la pile. Un Prometheus ajouté à cette pile le lit sur
    # http://app:9000/q/metrics. Voir docs/observabilite.md § Métriques.
    ports:
      - "127.0.0.1:8080:8080"
    # Tout le fichier d'environnement est transmis tel quel, comme sur le
    # déploiement de référence : marque blanche, mentions légales, MCP, suivi
    # d'erreurs, sauvegarde, notifications de nuit… Chaque variable y est
    # décrite dans .env.prod.example.
    env_file:
      - .env.prod
    # Ne restent ici que les valeurs que la pile FIXE, celles dont le nom
    # change en chemin, les défauts qui diffèrent de ceux de l'application, et
    # les variables OBLIGATOIRES : un `?` fait échouer le démarrage plutôt que
    # de laisser passer un mot de passe de développement en production.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/festival
      DB_USER: festival
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD est obligatoire}
      # Sans clé fixe, les sessions admin sont invalidées à chaque redémarrage.
      QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY est obligatoire (>= 16 caractères)}
      # URL publique, imprimée comme lien « espace animateur » sur les PDF.
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL est obligatoire}
      # Le proxy termine le TLS : sans cela, la redirection de connexion repart
      # en http et le cookie de session perd son flag Secure.
      PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # SMTP réel : c'est par là que partent les codes d'accès de l'espace
      # animateur. Relais authentifié en STARTTLS par défaut — l'application,
      # elle, part sur un Mailpit local (1025, sans TLS).
      MAIL_MOCK: "false"
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST est obligatoire}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM est obligatoire}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_START_TLS: ${MAIL_START_TLS:-REQUIRED}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Sauvegarde de nuit : le répertoire monté ci-dessous. Vider BACKUP_DIR
      # désactive la fonctionnalité. Voir docs/exploitation.md § Sauvegarde.
      BACKUP_DIR: ${BACKUP_DIR-/backup}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # Un répertoire de l'hôte, à côté de ce fichier, comme sur le déploiement
      # de référence : c'est là que l'exploitant le recopie hors machine,
      # chiffré (ces fichiers portent des données personnelles de mineurs). Il
      # doit appartenir à l'uid 1000, celui du conteneur :
      #   mkdir -p backup && sudo chown 1000:1000 backup
      # Sinon Docker le crée en root et la première sauvegarde échoue.
      - ./backup:/backup
    # Prête = base joignable et migrations à jour (/q/health/ready). L'image
    # ne contient pas `curl` (retiré après l'installation de pg_dump) : la
    # requête est écrite à la main par bash sur /dev/tcp, sans rien ajouter
    # à l'image. `start_period` couvre les migrations d'un premier démarrage.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /q/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    # Aucun `ports:` : la base n'est jamais publiée sur l'hôte, seul le réseau
    # interne de la pile la voit.
    environment:
      POSTGRES_DB: festival
      POSTGRES_USER: festival
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festival -d festival"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    name: postgres_data_pg18
