<mat-toolbar class="app-toolbar">
  <img src="logo.png" alt="Planning Équipes" class="app-logo" />
  <button matIconButton i18n-aria-label="@@shell.toggleNav" aria-label="Afficher/masquer la navigation" (click)="toggleDrawer()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title" i18n="@@shell.title">Planning</span>
  <span class="app-toolbar-spacer"></span>
  <app-job-monitor />
  <button matButton (click)="toggleLocale()" i18n-aria-label="@@shell.switchLanguage" aria-label="Changer de langue">
    {{ locale === 'fr' ? 'EN' : 'FR' }}
  </button>
</mat-toolbar>

<mat-sidenav-container class="app-shell">
  <mat-sidenav class="app-drawer" [mode]="drawerMode()" [opened]="drawerOpen()"
               (openedChange)="drawerOpen.set($event)">
    @for (group of navGroups; track group.title) {
      <mat-nav-list>
        <div matSubheader>{{ group.title }}</div>
        @for (link of group.links; track link.path) {
          @if (link.external) {
            <a mat-list-item [href]="link.path" target="_blank" rel="noopener">
              <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
              <span matListItemTitle>{{ link.label }}</span>
            </a>
          } @else {
            <a mat-list-item [routerLink]="link.path" routerLinkActive="active-link" (click)="onNavigate()">
              <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
              <span matListItemTitle>{{ link.label }}</span>
            </a>
          }
        }
      </mat-nav-list>
      <mat-divider />
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="app-page">
      <app-groupe-mismatch-banner />
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
