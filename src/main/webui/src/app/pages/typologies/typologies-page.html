<mat-card appearance="outlined" class="page-card">
  <mat-card-header>
    <mat-card-title i18n="@@typologies.list.title">Typologies ({{ store.typologies().length }})</mat-card-title>
  </mat-card-header>
  <mat-card-actions class="card-actions">
    <button matButton="filled" type="button" [disabled]="editingLocked()" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      <ng-container i18n="@@common.add">Ajouter</ng-container>
    </button>
  </mat-card-actions>
  <mat-card-content class="table-wrapper">
    <table mat-table [dataSource]="store.typologies()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef i18n="@@common.id">Id</th>
        <td mat-cell *matCellDef="let typologie">{{ typologie.id }}</td>
      </ng-container>
      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef i18n="@@typologies.field.label">Libellé</th>
        <td mat-cell *matCellDef="let typologie">{{ typologie.label }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef i18n-aria-label="@@common.actions" aria-label="Actions"></th>
        <td mat-cell *matCellDef="let typologie" class="row-actions">
          <button matIconButton i18n-matTooltip="@@common.edit" matTooltip="Modifier" i18n-aria-label="@@common.edit" aria-label="Modifier" [disabled]="editingLocked()" (click)="edit(typologie)">
            <mat-icon>edit</mat-icon>
          </button>
          <button matIconButton i18n-matTooltip="@@common.delete" matTooltip="Supprimer" i18n-aria-label="@@common.delete" aria-label="Supprimer" class="danger-action" [disabled]="editingLocked()"
                  (click)="remove(typologie)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
    @if (store.typologies().length === 0) {
      <p class="empty-hint" i18n="@@typologies.empty">Aucune typologie pour le moment.</p>
    }
  </mat-card-content>
</mat-card>
