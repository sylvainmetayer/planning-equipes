<main class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <app-brand-logo />
      <mat-card-title i18n="@@login.titre">{{ productName }} — administration</mat-card-title>
      <mat-card-subtitle i18n="@@login.sousTitre">
        Cet espace est réservé à l'organisation. Animateurs : utilisez le lien personnel imprimé
        sur votre planning.
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (submit)="connecter($event)">
        <mat-form-field appearance="outline">
          <mat-label i18n="@@login.utilisateur">Utilisateur</mat-label>
          <input matInput name="j_username" autocomplete="username"
                 [ngModel]="utilisateur()" (ngModelChange)="utilisateur.set($event)" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label i18n="@@login.motDePasse">Mot de passe</mat-label>
          <input matInput type="password" name="j_password" autocomplete="current-password"
                 [ngModel]="motDePasse()" (ngModelChange)="motDePasse.set($event)" />
        </mat-form-field>
        @if (echec()) {
          <p class="login-echec" role="alert">
            <mat-icon inline>error</mat-icon>
            <span i18n="@@login.echec">Identifiants incorrects.</span>
          </p>
        }
        <button matButton="filled" type="submit" [disabled]="enCours() || !utilisateur() || !motDePasse()">
          <mat-icon>login</mat-icon>
          <span i18n="@@login.connexion">Se connecter</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
