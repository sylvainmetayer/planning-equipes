<mat-card appearance="outlined" class="page-card">
  <mat-card-header>
    <h2 mat-card-title i18n="@@dataSetup.scenarios.title">Scénarios</h2>
    <mat-card-subtitle i18n="@@debug.scenarios.description">
      Charge un scénario livré avec l'application par-dessus l'édition actuelle : fixtures de
      démonstration, barreaux de la gamme, cas extrêmes. L'édition visée est rappelée au moment de
      confirmer.
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-actions class="card-actions">
    <mat-form-field appearance="outline" class="scenario-select">
      <mat-label i18n="@@dataSetup.scenario">Scénario</mat-label>
      <mat-select
        [value]="selectedScenario()"
        (valueChange)="onSelectScenario($event)"
        [disabled]="editionLocked() || chargement() || scenarios().length === 0"
      >
        @for (name of scenarios(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button
      matButton="outlined"
      [disabled]="editionLocked() || chargement() || scenarios().length === 0"
      (click)="onLoadSample()"
    >
      <mat-icon>auto_awesome</mat-icon>
      <ng-container i18n="@@dataSetup.loadSample">Charger le scénario sélectionné</ng-container>
    </button>
  </mat-card-actions>
  <mat-card-content>
    <app-output-panel [text]="output()" />
  </mat-card-content>
</mat-card>
