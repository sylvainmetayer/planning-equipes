<h2 mat-dialog-title>{{ formTitle() }}</h2>
<form (ngSubmit)="save()">
<mat-dialog-content class="form-grid">
<fieldset class="form-fieldset" [disabled]="editingLocked()">
@if (editingLocked()) {
  <p class="locked-hint span-2" i18n="@@stands.lockedHint">L'édition est verrouillée pendant que le solveur est en cours d'exécution.</p>
}
<mat-form-field appearance="outline">
  <mat-label i18n="@@stands.field.id">Identifiant</mat-label>
  <input matInput name="id" required [readonly]="!!editingId()"
         [ngModel]="draft().id" (ngModelChange)="patch({ id: $event })" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label i18n="@@stands.field.nom">Nom</mat-label>
  <input matInput name="nom" required [ngModel]="draft().nom" (ngModelChange)="patch({ nom: $event })" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label i18n="@@emplacements.field.latitude">Latitude</mat-label>
  <input matInput name="latitude" type="number" step="any" min="-90" max="90"
         [ngModel]="draft().latitude" (ngModelChange)="patch({ latitude: $event })" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label i18n="@@emplacements.field.longitude">Longitude</mat-label>
  <input matInput name="longitude" type="number" step="any" min="-180" max="180"
         [ngModel]="draft().longitude" (ngModelChange)="patch({ longitude: $event })" />
</mat-form-field>
<app-status-message class="span-2" [text]="messagePosition()" tone="info" />
<app-map-picker class="span-2"
  [latitude]="draft().latitude" [longitude]="draft().longitude"
  [disabled]="editingLocked()"
  (positionChange)="onPositionChange($event)" />
</fieldset>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="dialogRef.close(false)" i18n="@@common.cancel">Annuler</button>
  <button matButton="filled" type="submit" [disabled]="editingLocked()">
    <mat-icon>save</mat-icon>
    {{ submitLabel() }}
  </button>
</mat-dialog-actions>
</form>
