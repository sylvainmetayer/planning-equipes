<mat-card appearance="outlined" class="page-card">
  <mat-card-header>
    <mat-card-title i18n="@@emplacements.list.title">Emplacements ({{ store.emplacements().length }})</mat-card-title>
  </mat-card-header>
  <mat-card-actions class="card-actions">
    <button matButton="filled" type="button" [disabled]="editingLocked()" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      <ng-container i18n="@@common.add">Ajouter</ng-container>
    </button>
  </mat-card-actions>
  <mat-card-content class="table-wrapper">
    <table mat-table [dataSource]="store.emplacements()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef i18n="@@common.id">Id</th>
        <td mat-cell *matCellDef="let emplacement">{{ emplacement.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef i18n="@@common.nom">Nom</th>
        <td mat-cell *matCellDef="let emplacement">{{ emplacement.nom }}</td>
      </ng-container>
      <ng-container matColumnDef="coordonnees">
        <th mat-header-cell *matHeaderCellDef i18n="@@emplacements.column.coordonnees">Coordonnées</th>
        <td mat-cell *matCellDef="let emplacement">{{ coordonneesLabel(emplacement) }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef i18n-aria-label="@@common.actions" aria-label="Actions"></th>
        <td mat-cell *matCellDef="let emplacement" class="row-actions">
          <button matIconButton i18n-matTooltip="@@common.edit" matTooltip="Modifier" i18n-aria-label="@@common.edit" aria-label="Modifier" [disabled]="editingLocked()" (click)="edit(emplacement)">
            <mat-icon>edit</mat-icon>
          </button>
          <button matIconButton i18n-matTooltip="@@common.delete" matTooltip="Supprimer" i18n-aria-label="@@common.delete" aria-label="Supprimer" class="danger-action" [disabled]="editingLocked()"
                  (click)="remove(emplacement)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
    @if (store.emplacements().length === 0) {
      <p class="empty-hint" i18n="@@emplacements.empty">Aucun emplacement pour le moment. Créez-en un ci-dessus.</p>
    }
  </mat-card-content>
</mat-card>
