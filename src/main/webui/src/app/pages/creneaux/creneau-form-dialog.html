<h2 mat-dialog-title>{{ formTitle() }}</h2>
<form (ngSubmit)="save()">
<mat-dialog-content class="form-grid">
<fieldset class="form-fieldset" [disabled]="editingLocked()">
@if (editingLocked()) {
  <p class="locked-hint span-2" i18n="@@stands.lockedHint">L'édition est verrouillée pendant que le solveur est en cours d'exécution.</p>
}
<mat-form-field appearance="outline">
  <mat-label i18n="@@creneaux.field.date">Date</mat-label>
  <input matInput name="date" type="date" required
         [ngModel]="draft().date" (ngModelChange)="patch({ date: $event })" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label i18n="@@creneaux.field.heureDebut">Début</mat-label>
  <input matInput name="heureDebut" type="time" required
         [ngModel]="draft().heureDebut" (ngModelChange)="patch({ heureDebut: $event })" />
</mat-form-field>
<mat-form-field appearance="outline">
  <mat-label i18n="@@creneaux.field.heureFin">Fin</mat-label>
  <input matInput name="heureFin" type="time" required
         [ngModel]="draft().heureFin" (ngModelChange)="patch({ heureFin: $event })" />
</mat-form-field>
<mat-checkbox name="couverturePause" class="span-2"
              i18n-matTooltip="@@creneaux.couverturePause.tooltip"
              matTooltip="Vacation de relais pendant la coupure repas : chaque stand n'y reçoit que la moitié de ses sièges, arrondie au supérieur, pour que l'autre moitié mange."
              [ngModel]="draft().couverturePause" (ngModelChange)="patch({ couverturePause: $event })"
              i18n="@@creneaux.field.couverturePause">Relais repas (effectif divisé par deux)</mat-checkbox>
@if (franchitMinuit()) {
  <p class="locked-hint span-2" i18n="@@creneaux.franchitMinuit">Ce créneau franchit minuit : il se termine le lendemain.</p>
}
</fieldset>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="dialogRef.close(false)" i18n="@@common.cancel">Annuler</button>
  <button matButton="filled" type="submit" [disabled]="formulaireInvalide() || editingLocked()">
    <mat-icon>save</mat-icon>
    {{ submitLabel() }}
  </button>
</mat-dialog-actions>
</form>
