<mat-card appearance="outlined" class="page-card">
  <mat-card-header>
    <mat-card-title>Configuration des données</mat-card-title>
    <mat-card-subtitle>
      Initialisez la base avec un scénario d'exemple ou réinitialisez-la. Ces actions sont verrouillées pendant que le solveur est en cours d'exécution.
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-actions class="card-actions">
    <mat-form-field appearance="outline" class="scenario-select">
      <mat-label>Scénario</mat-label>
      <mat-select [value]="selectedScenario()" (valueChange)="onSelectScenario($event)"
        [disabled]="solverBusy() || sampleLoading() || scenarios().length === 0">
        @for (name of scenarios(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button matButton="outlined" [disabled]="solverBusy() || sampleLoading() || scenarios().length === 0"
      (click)="onLoadSample()">
      <mat-icon>auto_awesome</mat-icon>
      Charger le planning d'exemple
    </button>
    <button matButton="outlined" class="danger-action" [disabled]="solverBusy() || resetting()"
      (click)="onResetDatabase()">
      <mat-icon>delete_sweep</mat-icon>
      Vider la base de données
    </button>
  </mat-card-actions>
</mat-card>

<app-output-panel [text]="output()" />
