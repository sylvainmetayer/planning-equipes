@if (visible()) {
  <mat-card appearance="outlined" class="page-card">
    <mat-card-header>
      <h2 mat-card-title i18n="@@solver.scoreCurve.title">Progression du score</h2>
      @if (!folded()) {
        <mat-card-subtitle i18n="@@solver.scoreCurve.hint">
          Les trois niveaux de score de la résolution en cours, chacun à son échelle ; le haut de chaque cadre est le
          zéro, c'est-à-dire plus rien à corriger.
        </mat-card-subtitle>
      }
    </mat-card-header>
    <mat-card-actions class="card-actions">
      <button
        matButton
        type="button"
        [attr.aria-expanded]="!folded()"
        i18n-matTooltip="@@solver.scoreCurve.bascule.tooltip"
        matTooltip="La courbe continue d'être enregistrée quand elle est réduite : la rouvrir montre la résolution depuis son début."
        (click)="toggle()"
      >
        <mat-icon>{{ folded() ? 'expand_more' : 'expand_less' }}</mat-icon>
        <span>{{ toggleLabel() }}</span>
      </button>
    </mat-card-actions>
    <mat-card-content>
      <app-score-chart
        [points]="points()"
        [dureeMs]="durationMs()"
        [termine]="finished()"
        [replie]="folded()"
      />
    </mat-card-content>
  </mat-card>
}
