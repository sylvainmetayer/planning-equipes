<mat-card appearance="outlined" class="page-card">
  <mat-card-header>
    <mat-card-title i18n="@@nav.link.solver">Solveur</mat-card-title>
    <mat-card-subtitle i18n="@@solver.description">
      Exécute Timefold en arrière-plan ; le résultat est analysé automatiquement. Une seule tâche du solveur s'exécute à la
      fois pour tout le serveur. Initialisez ou réinitialisez les données depuis la page Configuration des données.
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-actions class="card-actions">
    <button matButton="filled" [disabled]="solverBusy()" (click)="onTimefoldSolve()">
      <mat-icon>play_arrow</mat-icon>
      <ng-container i18n="@@solver.solve">Résoudre avec Timefold</ng-container>
    </button>
    <button matButton="tonal" [disabled]="exportBusy() || solverBusy()" (click)="onExportPlanning()">
      <mat-icon>archive</mat-icon>
      <ng-container i18n="@@solver.export">Exporter le planning (PDF + ICS)</ng-container>
    </button>
  </mat-card-actions>
</mat-card>

<app-feasibility-banner [report]="feasibility()" />
<app-output-panel [text]="output()" />
