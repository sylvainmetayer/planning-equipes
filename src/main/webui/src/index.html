<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Placeholder only: the real name comes from /api/branding and is set
         before the application bootstraps (src/app/core/branding.ts). A static
         file cannot carry a per-deployment name. -->
    <title>Planning</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Third statement of the same rule, after public/robots.txt and the
         X-Robots-Tag header: an internal tool has nothing to index, and an
         espace URL is somebody's access token. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Roboto and Material Icons are self-hosted (public/fonts + styles/fonts.css):
         no dependency on fonts.googleapis.com, so icons render offline too. -->
    <link
      rel="preload"
      href="/fonts/material-icons.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
