quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.username=${DB_USER:festival}
%dev.quarkus.datasource.password=${DB_PASSWORD:festival}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/festival}

%prod.quarkus.datasource.username=${DB_USER:festival}
%prod.quarkus.datasource.password=${DB_PASSWORD:festival}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/festival}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Tests run against a throwaway PostgreSQL container started by Quarkus dev
# services, so Flyway migrations execute exactly as in production.
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17
%test.quarkus.datasource.devservices.reuse=false

planning.solver.seconds-limit=180
# 0 disables the unimproved-time bailout: local search gets the full
# seconds-limit budget instead of giving up after a plateau, which was
# causing solves to stop on a hard-constraint local optimum before the time
# budget was exhausted.
planning.solver.unimproved-seconds-limit=0
%test.planning.solver.seconds-limit=3
%test.planning.solver.unimproved-seconds-limit=2

# Per-constraint weight overrides (ai.timefold.solver.core.api.domain.solution.
# ConstraintWeightOverrides), read once at startup by PlanningService. Each
# property is how many hard/medium/soft points a single match of that
# constraint is worth; the default below (1) is exactly the ONE_HARD/
# ONE_MEDIUM/ONE_SOFT literal already passed to penalize(...) in the
# constraint code, so retuning a value here changes solve behaviour without
# touching Java. See docs/contraintes.md for what each constraint does.
planning.constraint-weights.posteDoitEtrePourvu=1
planning.constraint-weights.animateurDisponible=1
planning.constraint-weights.competenceCompatible=1
planning.constraint-weights.pasDeChevauchementHoraire=1
planning.constraint-weights.standReserveAuxMajeurs=1
planning.constraint-weights.mineurNecessiteEncadrementMajeur=1
planning.constraint-weights.travailDeNuitInterditPourMineur=1
planning.constraint-weights.dureeQuotidienneMaxMineur=1
planning.constraint-weights.dureeHebdomadaireMax=1
planning.constraint-weights.dureeHebdomadaireMaxMineur=1
planning.constraint-weights.dureeQuotidienneMaxMajeur=1
planning.constraint-weights.reposQuotidienMinimal=1
planning.constraint-weights.travailContinuMaxMajeur=1
planning.constraint-weights.travailContinuMaxMineur=1
planning.constraint-weights.maxJoursTravaillesParSemaine=1
planning.constraint-weights.reposHebdomadaireMinimal=1
planning.constraint-weights.reposHebdomadaireMineur=1
planning.constraint-weights.travailInterditJourFerieMineur=1
planning.constraint-weights.indisponibiliteForcee=1
planning.constraint-weights.incompatibiliteAdHoc=1
planning.constraint-weights.affectationForcee=1
planning.constraint-weights.standComplexeAvecReferent=1
planning.constraint-weights.equilibrerCharge=1
planning.constraint-weights.repartitionMineursParCreneau=1
planning.constraint-weights.experienceRequisePourStandsPremium=1
planning.constraint-weights.eviterRoulementStandsPremium=1
planning.constraint-weights.eviterChangementEmplacementEloigne=1
planning.constraint-weights.favoriserRotationDesStands=1
planning.constraint-weights.favoriserMixiteDesNiveaux=1

quarkus.http.port=${HTTP_PORT:8080}

# By default Quarkus REST mounts its JAX-RS dispatcher at the HTTP root ("/"),
# so it claims every request there to check for a matching resource and sends
# its own 404 for anything unmatched (e.g. an Angular route like /creneaux) -
# before Quinoa's SPA fallback route, registered at a much lower priority,
# ever runs. This 404s every deep link in prod even with enable-spa-routing
# enabled. Moving REST off the root frees up non-API paths for Quinoa; each
# resource's @Path had its own leading "/api" stripped to keep external URLs
# identical (e.g. @Path("/api/config") -> @Path("/config")).
quarkus.rest.path=/api

# Angular frontend (src/main/webui) built and served by Quinoa.
# Node and npm are downloaded by the build itself, so no local toolchain is
# required to package the application (CI, Docker).
quarkus.quinoa.build-dir=dist/planning-equipes-ui/browser
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.18.0
# Angular owns the client-side routes: unknown paths must return index.html.
quarkus.quinoa.enable-spa-routing=true
# Live coding: `ng serve` is started and proxied by quarkus:dev. The command is
# set explicitly because Quinoa's default Angular arguments (--disable-host-check)
# are rejected by the current Angular CLI.
%dev.quarkus.quinoa.dev-server.port=4200
%dev.quarkus.quinoa.package-manager-command.dev=run start
# The frontend is irrelevant to the backend tests and would slow them down.
%test.quarkus.quinoa.enabled=false

# Observability: error tracking (Sentry-protocol DSN, typically a Bugsink
# instance) and product analytics (PostHog). Both stay disabled (blank) unless
# the env var is set, so dev/test never send anything anywhere by default; see
# docs/observabilite.md for how to obtain and configure real values in prod.
observability.sentry.dsn=${SENTRY_DSN:}
observability.sentry.environment=${SENTRY_ENVIRONMENT:local}
observability.posthog.api-key=${POSTHOG_API_KEY:}
observability.posthog.host=${POSTHOG_HOST:https://eu.i.posthog.com}
