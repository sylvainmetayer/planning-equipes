quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.username=${DB_USER:festival}
%dev.quarkus.datasource.password=${DB_PASSWORD:festival}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/festival}

%prod.quarkus.datasource.username=${DB_USER:festival}
%prod.quarkus.datasource.password=${DB_PASSWORD:festival}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/festival}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Tests run against a throwaway PostgreSQL container started by Quarkus dev
# services, so Flyway migrations execute exactly as in production.
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17
%test.quarkus.datasource.devservices.reuse=false

planning.solver.seconds-limit=180
# Plateau bailout, applied ONLY once the planning is feasible (hard score 0) —
# see PlanningService#applyTermination. A bare unimproved-time limit used to be
# set here and had to be disabled: it stopped local search on a hard-constraint
# local optimum, minutes before the budget was spent, leaving seats unfilled.
# AND-ed with feasibility it can only cut time spent polishing medium/soft
# score on an already workable planning. 0 disables it again.
planning.solver.unimproved-seconds-limit=300
%test.planning.solver.seconds-limit=3
%test.planning.solver.unimproved-seconds-limit=2

# La file de résolution est rejouée au démarrage (voir SolverJobService), sauf
# en test : une tâche laissée en file par une exécution précédente déclencherait
# un vrai solve au démarrage de la suivante. Les tests de reprise appellent
# SolverJobService.restaurer() directement.
%test.planning.jobs.reprise-au-demarrage=false

# Per-constraint weight overrides (ai.timefold.solver.core.api.domain.solution.
# ConstraintWeightOverrides), read once at startup by PlanningService. Each
# property is how many hard/medium/soft points a single match of that
# constraint is worth; the default below (1) is exactly the ONE_HARD/
# ONE_MEDIUM/ONE_SOFT literal already passed to penalize(...) in the
# constraint code, so retuning a value here changes solve behaviour without
# touching Java. See docs/contraintes.md for what each constraint does.
planning.constraint-weights.posteDoitEtrePourvu=1
planning.constraint-weights.animateurDisponible=1
planning.constraint-weights.pasDeChevauchementHoraire=1
planning.constraint-weights.standReserveAuxMajeurs=1
planning.constraint-weights.mineurNecessiteEncadrementMajeur=1
planning.constraint-weights.travailDeNuitInterditPourMineur=1
planning.constraint-weights.dureeQuotidienneMaxMineur=1
planning.constraint-weights.dureeHebdomadaireMax=1
planning.constraint-weights.dureeHebdomadaireMaxMineur=1
planning.constraint-weights.dureeQuotidienneMaxMajeur=1
planning.constraint-weights.reposQuotidienMinimal=1
planning.constraint-weights.travailContinuMaxMajeur=1
planning.constraint-weights.travailContinuMaxMineur=1
planning.constraint-weights.maxJoursTravaillesParSemaine=1
planning.constraint-weights.reposHebdomadaireMinimal=1
planning.constraint-weights.reposHebdomadaireMineur=1
planning.constraint-weights.travailInterditJourFerieMineur=1
planning.constraint-weights.animateurVerrouilleCreneauFige=1
planning.constraint-weights.indisponibiliteForcee=1
planning.constraint-weights.incompatibiliteAdHoc=1
planning.constraint-weights.affectationForcee=1
planning.constraint-weights.affiniteAdHoc=1
planning.constraint-weights.standComplexeAvecReferent=1
planning.constraint-weights.equilibrerCharge=1
planning.constraint-weights.repartitionMineursParCreneau=1
planning.constraint-weights.experienceRequisePourStandsPremium=1
planning.constraint-weights.eviterRoulementStandsPremium=1
planning.constraint-weights.eviterChangementEmplacementEloigne=1
planning.constraint-weights.limiterEmplacementsParJour=1
planning.constraint-weights.favoriserMixiteDesNiveaux=1
planning.constraint-weights.preserverBufferPolyvalents=1
# Ratio 3:1 between appreciationIncompatible and souhaitsIncompatibles: the
# solver always eliminates an appreciation mismatch first, before optimising
# wish satisfaction ("privilégier le réel sur le souhaité").
planning.constraint-weights.appreciationIncompatible=3
planning.constraint-weights.souhaitsIncompatibles=1
planning.constraint-weights.limiterTypologiesDistinctesParAnimateur=1
# Weighted well above the other medium constraints: an animateur running past
# six consecutive worked days is a fatigue/burnout risk the organiser wants
# the solver to eliminate before optimising the rest of the "Qualité
# d'organisation" family.
planning.constraint-weights.maxJoursConsecutifsTravailles=5

# Quality thresholds carried to the solver as a ParametresQualite problem fact
# (read once at startup by PlanningService, same as the weights above). Unlike
# the legal parameters, these are not stored per edition: they tune comfort,
# not the law. Above this many distinct emplacements covered in a single day,
# limiterEmplacementsParJour penalises the animateur's day as scattered — a
# very large value neutralises the rule without disabling it.
planning.contraintes.max-emplacements-par-jour=3

quarkus.http.port=${HTTP_PORT:8080}

# ----- Behind a TLS-terminating reverse proxy -----
# In production the browser reaches the application over HTTPS, but the proxy
# forwards the request to the origin in clear text. Without this setting Vert.x
# only knows the scheme of the real connection (http), and Quarkus builds its
# redirects as absolute URLs from it (FormAuthenticationMechanism#
# assembleRedirectLocation = scheme://authority/path): the redirect answering a
# successful login pointed back at http://<host>/api/auth/me, which the browser
# refuses to follow from an https page (active mixed content blocked), making
# it impossible to log in at all. Honouring the X-Forwarded-* headers lines
# scheme(), authority() and isSSL() up with the request the visitor actually
# made: https redirects, and a session cookie marked Secure.
#
# With no proxy in front, no X-Forwarded-* header ever arrives and nothing
# changes (dev, tests, container exposed directly). PROXY_ADDRESS_FORWARDING=
# false restores the previous behaviour. Two Quarkus settings complement this
# one when needed, straight from the environment:
# QUARKUS_HTTP_PROXY_TRUSTED_PROXIES pins the addresses whose forwarded headers
# are accepted (worth setting when the origin is reachable without going
# through the proxy), and QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST covers a
# proxy that rewrites Host instead of passing the visitor's own.
quarkus.http.proxy.proxy-address-forwarding=${PROXY_ADDRESS_FORWARDING:true}

# By default Quarkus REST mounts its JAX-RS dispatcher at the HTTP root ("/"),
# so it claims every request there to check for a matching resource and sends
# its own 404 for anything unmatched (e.g. an Angular route like /creneaux) -
# before Quinoa's SPA fallback route, registered at a much lower priority,
# ever runs. This 404s every deep link in prod even with enable-spa-routing
# enabled. Moving REST off the root frees up non-API paths for Quinoa; each
# resource's @Path had its own leading "/api" stripped to keep external URLs
# identical (e.g. @Path("/api/config") -> @Path("/config")).
quarkus.rest.path=/api

# ----- En-têtes de sécurité navigateur (EnTetesSecuriteFilter) -----
# Politique de sécurité du contenu appliquée à tout sauf /q/* (Swagger UI sert
# des scripts inline que nous ne contrôlons pas). Le SPA ne charge aucun script
# tiers hormis la balise Cloudflare Web Analytics, chargée dynamiquement par
# observability.ts quand un token est configuré ; 'unsafe-inline' reste
# nécessaire côté styles, qu'Angular Material écrit dans la page. connect-src
# laisse passer https: parce que l'endpoint Sentry/Bugsink est propre à chaque
# déploiement (SENTRY_DSN), et img-src fait de même pour les tuiles
# OpenStreetMap du sélecteur de carte. Vider la variable désactive l'en-tête.
planning.securite.csp=${CSP:default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:}
# HSTS, envoyé uniquement sur une visite HTTPS. Un an, sous-domaines compris ;
# ne pas ajouter `preload` sans avoir décidé que le domaine ne resservira
# jamais en clair. Vider la variable désactive l'en-tête.
planning.securite.hsts=${HSTS:max-age=31536000; includeSubDomains}

# ----- Plafonds du serveur HTTP -----
# La taille de corps est déjà bornée par défaut côté Quarkus ; on la rend
# explicite et réglable parce que c'est l'import de dump SQL
# (POST /api/database/import, un script rejoué en entier) qui la dimensionne :
# un exploitant dont les dumps grossissent doit savoir quel bouton tourner, et
# celui qui n'utilise pas l'import gagne à descendre le plafond.
quarkus.http.limits.max-body-size=${MAX_BODY_SIZE:10M}
# Celui-ci, en revanche, est illimité par défaut : sans plafond, ouvrir des
# connexions sans jamais rien envoyer suffit à épuiser le serveur. Large au
# regard de l'usage réel (une poignée d'admins, ~150 animateurs qui consultent
# leur planning), donc sans effet sur le trafic légitime.
quarkus.http.limits.max-connections=${MAX_CONNECTIONS:500}

# ----- Débit des demandes de code de l'espace animateur -----
# POST /api/espace-animateur/{jeton}/code envoie un mail : sans plafond,
# quiconque tient le lien noie la boîte de l'animateur et épuise le quota SMTP.
# Ne sont comptés que les codes JAMAIS utilisés (ouvrir la session efface le
# compteur), donc un animateur qui se connecte normalement ne l'atteint jamais.
# La fenêtre est calée sur la validité d'un code : au-delà, le précédent était
# de toute façon périmé.
planning.espace.code.max-demandes=${ESPACE_CODE_MAX_DEMANDES:3}
planning.espace.code.fenetre=${ESPACE_CODE_FENETRE:PT10M}

# OpenAPI documentation and Swagger UI, served in production too (not only in
# dev) so the deployed instance documents itself — behind the admin session.
# They describe every endpoint and every payload shape: public, they would hand
# a map of the API to anyone, and Swagger UI would offer to call it. Unlike
# /api/*, /q/* is not covered by the rule below, so it needs its own.
quarkus.swagger-ui.always-include=true
quarkus.http.auth.permission.api-docs.paths=/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.api-docs.policy=authenticated
# Same reasoning as admin-api: the functional tests call the API without a
# session; the protection itself is exercised by AuthentificationAdminTest,
# whose profile restores this policy.
%test.quarkus.http.auth.permission.api-docs.policy=permit

# Angular frontend (src/main/webui) built and served by Quinoa.
# Node and npm are downloaded by the build itself, so no local toolchain is
# required to package the application (CI, Docker).
quarkus.quinoa.build-dir=dist/planning-equipes-ui/browser
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.18.0
# Angular owns the client-side routes: unknown paths must return index.html.
quarkus.quinoa.enable-spa-routing=true
# Live coding: `ng serve` is started and proxied by quarkus:dev. The command is
# set explicitly because Quinoa's default Angular arguments (--disable-host-check)
# are rejected by the current Angular CLI.
%dev.quarkus.quinoa.dev-server.port=4200
# `enable-spa-routing` above only takes effect when Quinoa serves prebuilt static
# files (prod); in dev mode Quinoa instead proxies to ng serve and refuses to
# trust its HTML fallback response unless the path is "/" or ends in ".html",
# so any other Angular route (e.g. /creneaux) 404s. ng serve already does SPA
# routing correctly on its own, so tell Quinoa to trust it directly. Safe here
# because every backend endpoint lives under /api, which Quinoa still routes
# to the backend before ever reaching this forwarding logic.
%dev.quarkus.quinoa.dev-server.direct-forwarding=true
%dev.quarkus.quinoa.package-manager-command.dev=run start
# The frontend is irrelevant to the backend tests and would slow them down.
%test.quarkus.quinoa.enabled=false

# Observability: error tracking (Sentry-protocol DSN, typically a Bugsink
# instance) and analytics (Cloudflare Web Analytics). Everything
# stays disabled (blank) unless configured; see docs/observabilite.md.
observability.sentry.dsn=${SENTRY_DSN:}
observability.sentry.environment=${SENTRY_ENVIRONMENT:local}
observability.cloudflare.web-analytics-token=
%prod.observability.cloudflare.web-analytics-token=${CLOUDFLARE_WEB_ANALYTICS_TOKEN:987d563a0f264bbbb484df80ab2ab0f8}

# Referrer-Policy: l'URL de l'espace animateur porte son jeton d'accès dans le
# chemin. Sans cet en-tête, tout lien sortant l'emporterait dans le Referer —
# c'est-à-dire l'identifiant d'une personne, souvent mineure, communiqué au
# site visité. `same-origin` conserve le Referer entre nos propres pages (utile
# au diagnostic) et le supprime dès qu'on quitte le domaine.
quarkus.http.header."Referrer-Policy".value=same-origin

# MCP (Model Context Protocol) server (see dev.sylvain.planning.mcp,
# docs/mcp.md): exposes a curated, privacy-filtered set of tools at
# /mcp (streamable HTTP) and /mcp/sse so an AI assistant can consult/drive
# the app in natural language. Secure by default: with planning.mcp.api-key
# blank (the default), McpApiKeyAuthenticationMechanism can never establish
# an identity, so the policy below rejects every /mcp request with 401
# instead of serving it unauthenticated.
planning.mcp.api-key=${PLANNING_MCP_API_KEY:}
planning.mcp.api-key-header=${PLANNING_MCP_API_KEY_HEADER:X-MCP-Api-Key}
# Optional extra headers required alongside the API key, as a comma-separated
# list of Nom-Header=valeur (escape a literal comma with \,). Meant for a
# deployment behind a reverse proxy that authenticates callers by a custom
# header — e.g. Pangolin's P-Access-Token-Id/P-Access-Token — so the origin
# stays protected if it is reachable without going through the proxy. Unset by
# default; only list headers the proxy actually forwards.
planning.mcp.required-headers=${PLANNING_MCP_REQUIRED_HEADERS:}
# The Pangolin access-proxy token itself, so the MCP page can reveal it
# (same admin-password gate as the API key) instead of the operator having to
# copy it in by hand. Unset by default; only relevant behind Pangolin.
planning.mcp.pangolin.access-token-id=${PLANNING_MCP_PANGOLIN_ACCESS_TOKEN_ID:}
planning.mcp.pangolin.access-token=${PLANNING_MCP_PANGOLIN_ACCESS_TOKEN:}
%test.planning.mcp.api-key=test-mcp-key
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated

# ----- Admin authentication (issue #165) -----
# Single admin account defined in configuration (embedded users, no database),
# form login with an encrypted session cookie — "standard for now", replaced by
# OIDC later without touching the permission layout below. The username is
# fixed to "admin"; the password comes from ADMIN_PASSWORD (dev default:
# admin). The session cookie is encrypted with a key generated at startup
# unless QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY is provided (set it in
# production so sessions survive a restart).
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=${ADMIN_PASSWORD:admin}
quarkus.security.users.embedded.roles.admin=admin
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.cookie-name=planning-session
quarkus.http.auth.form.timeout=PT8H
quarkus.http.auth.form.cookie-same-site=strict
# Challenges are plain 401s, never a 302 to an HTML page: the MCP mechanism's
# 401 challenge outranks form auth (see McpApiKeyAuthenticationMechanism), so
# the frontend interceptor can turn any unauthenticated API call into a
# redirect to the Angular /login page, and a failed /j_security_check answers
# 401. The only redirect left is the successful login, sent to the session
# probe: the browser's fetch follows it and the login page reads the JSON.
quarkus.http.auth.form.landing-page=/api/auth/me
quarkus.http.auth.form.error-page=/api/auth/me

# Verrouillage après une série d'échecs (LimiteurConnexionsAdmin). Le compte
# admin est unique et sans second facteur : /j_security_check acceptait les
# tentatives au rythme du réseau, alors que la révélation de la clé MCP se
# verrouillait déjà au bout de cinq essais. Les échecs sont comptés à partir des
# événements de sécurité de Quarkus, activés juste en dessous — le succès, lui,
# se lit sur la requête, l'événement de connexion réussie ne portant aucun
# contexte HTTP (voir LimiteurConnexionsAdmin).
quarkus.security.events.enabled=true
planning.auth.connexion.max-echecs=${CONNEXION_MAX_ECHECS:5}
planning.auth.connexion.duree-blocage=${CONNEXION_DUREE_BLOCAGE:PT15M}

# Everything under /api is admin-only, with four deliberate exceptions:
# the espace animateur (its access token IS the credential, resolved
# server-side), the auth status/logout endpoints the login page needs,
# /api/config (client-facing observability keys the SPA loads on every page,
# login included), and /api/mentions-legales — a legal notice that only
# logged-in users could read would miss its readers. Static SPA files are outside /api and stay public — the
# data lives behind the API, not in the bundle. /mcp keeps its API-key policy
# above.
quarkus.http.auth.permission.espace-animateur.paths=/api/espace-animateur/*
quarkus.http.auth.permission.espace-animateur.policy=permit
quarkus.http.auth.permission.auth-public.paths=/api/auth/me,/api/auth/logout,/api/config,/api/mentions-legales
quarkus.http.auth.permission.auth-public.policy=permit
quarkus.http.auth.permission.admin-api.paths=/api/*
quarkus.http.auth.permission.admin-api.policy=authenticated
# Tests exercise the API directly (no session); the auth flow itself is
# covered by AuthentificationAdminTest, whose profile restores this policy.
%test.quarkus.http.auth.permission.admin-api.policy=permit

# ----- Authentification par en-tête (remote user) -----
# Mode facultatif pour un déploiement derrière un proxy d'accès qui authentifie
# lui-même ses visiteurs (Pangolin et consorts) et transmet l'adresse retenue.
# Désactivé par défaut : le form login ci-dessus reste le mode normal, et rien
# de ce bloc n'est consulté tant que enabled vaut false.
#
# Le secret n'est pas une option : un en-tête est une affirmation, pas une
# preuve, et sans lui quiconque atteint l'origine sans passer par le proxy
# obtiendrait le rôle admin en envoyant une ligne d'en-tête. Activer le mode
# sans secret fait donc échouer le démarrage (RemoteUserAuthentification), au
# lieu de laisser en place une configuration silencieusement grande ouverte.
# Le secret doit voyager sur un en-tête que le proxy écrase à chaque requête
# entrante, sans quoi un client peut le forger.
#
# admin-email désigne la seule adresse qui obtient le rôle admin ; toutes les
# autres adresses reconnues sont des animateurs, identifiés par l'e-mail de
# leur fiche — celui-là même auquel l'espace animateur envoie son code d'accès,
# dont l'attestation du proxy prend alors la place.
planning.auth.remote-user.enabled=${REMOTE_USER_ENABLED:false}
planning.auth.remote-user.header=${REMOTE_USER_HEADER:Remote-Email}
planning.auth.remote-user.secret-header=${REMOTE_USER_SECRET_HEADER:Remote-Auth-Secret}
planning.auth.remote-user.secret=${REMOTE_USER_SECRET:}
planning.auth.remote-user.admin-email=${REMOTE_USER_ADMIN_EMAIL:}

# ----- Échange notifications (issue #165) -----
# Dev and prod really send, to Mailpit by default (docker-compose ships it on
# localhost:1025, UI on :8025) — so a mail sent from `quarkus dev` lands in
# the Mailpit inbox instead of being silently mocked. Only the test profile
# mocks unconditionally; MAIL_MOCK=true restores mocking anywhere else.
# planning.mail.admin blank disables the "new demandes" notifications; animateurs
# without an email address on their fiche simply receive nothing.
quarkus.mailer.from=${MAIL_FROM:planning-equipes@localhost}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.mock=${MAIL_MOCK:false}
%test.quarkus.mailer.mock=true
planning.mail.admin=${MAIL_ADMIN:}
# Tests: a fixed admin address so the notifications that depend on one can be
# exercised at all (they are silently disabled without it, by design).
%test.planning.mail.admin=admin@example.org
# Public base URL, used for the espace-animateur link printed on the
# individual PDF plannings and for links inside notification mails.
planning.public-url=${PUBLIC_URL:http://localhost:8080}

# ----- Mentions légales -----
# Faits propres au déploiement, servis à la page /mentions-legales (publique).
# Volontairement hors du code : le dépôt est public, et pour un éditeur
# personne physique l'adresse et le numéro d'immatriculation SONT des données
# personnelles. Vides par défaut — la page affiche alors ce qui manque plutôt
# que d'inventer un éditeur.
planning.legal.editeur=${LEGAL_EDITEUR:}
planning.legal.directeur-publication=${LEGAL_DIRECTEUR_PUBLICATION:}
planning.legal.hebergeur=${LEGAL_HEBERGEUR:}
planning.legal.contact=${LEGAL_CONTACT:}
# Responsable de traitement au sens du RGPD, quand il diffère de l'éditeur au
# sens de la LCEN. Vide : c'est l'éditeur.
planning.legal.responsable-traitement=${LEGAL_RESPONSABLE_TRAITEMENT:}
planning.legal.donnees.base-legale=${LEGAL_BASE_LEGALE:}
planning.legal.donnees.conservation=${LEGAL_CONSERVATION:}
