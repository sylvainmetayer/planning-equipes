# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 17 : une organisation qui éteint des règles, et le fichier qui le dit.
# Deux longues vacations par jour, 10 h-15 h 30 et 15 h 30-21 h : la première
# traverse toute la fenêtre repas du midi, ce que la coupure repas ne permet pas.
# Le fichier désactive coupureRepasObligatoire et sa préférence, ainsi que la
# limite de typologies par animateur, et pèse fort l'équilibre de charge et les
# jours consécutifs. Dix stands n'ouvrent que le week-end.
# Sans la section contraintes, ce fichier ne se résout pas.

festival:
  dateDebut: 2027-09-06

contraintes:
  desactivees:
    - coupureRepasObligatoire
    - coupureRepasPlacementPrefere
    - limiterTypologiesDistinctesParAnimateur
  poids:
    equilibrerCharge: 4
    maxJoursConsecutifsTravailles: 5

