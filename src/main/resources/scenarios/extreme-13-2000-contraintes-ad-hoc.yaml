schemaVersion: 2
# Cas dégénéré 13 : huit cents contraintes ad hoc sur une semaine.
# Cinq cents incompatibilités et trois cents affinités, tirées pour qu'aucune ne
# contredise une autre. Le contrôle des contradictions compare les exceptions
# deux à deux : c'est lui, autant que le solve, que ce fichier mesure. (Le nom du
# fichier garde les deux mille d'avant la 4.0, qui comptait aussi deux cents
# affectations forcées et mille indisponibilités forcées, retirées depuis.)

