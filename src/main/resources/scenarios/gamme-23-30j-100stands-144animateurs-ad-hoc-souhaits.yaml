# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 23 : un mois de souhaits et d'exceptions saisies à la main.
# Août 2027, cent stands d'une place dont soixante n'ouvrent que le week-end.
# Neuf animateurs sur dix déclarent des souhaits, pesés à 2. Cinquante-quatre
# contraintes ad hoc de tous types, posées sur des animateurs toujours
# disponibles et jamais deux fois sur la même personne, pour qu'aucune ne
# contredise une autre.

festival:
  dateDebut: 2027-08-02

contraintes:
  poids:
    souhaitsIncompatibles: 2
    appreciationIncompatible: 3

