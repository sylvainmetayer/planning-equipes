# Scénario extrême 7 : une grille au pas d'une heure.
# Douze vacations d'une heure par jour, de 9 h à 21 h, jointives (pause minimale à
# 0). Une journée de travail est une chaîne de sièges : le travail continu de six
# heures, la coupure repas et la durée quotidienne se lisent sur des dizaines de
# petits sièges plutôt que sur deux gros.

