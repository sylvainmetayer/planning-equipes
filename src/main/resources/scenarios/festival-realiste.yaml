# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Fixture anonymisée, GÉNÉRÉE par src/main/resources/anonymiser-scenario.py
# depuis un scénario réel hors dépôt. Ne pas éditer ici ce qui devrait l'être
# dans la source : la prochaine régénération écrase ce fichier.
#
# Seuls les identifiants ont changé — prénoms/noms des animateurs, ids et noms
# des emplacements et des stands, nom de l'édition. Dates, heures, effectifs,
# compétences, horaires et paramètres sont ceux de l'original, et les
# coordonnées sont translatées en longitude à latitude constante : la
# contrainte de distance entre emplacements voit exactement les mêmes valeurs.
# Cette fixture doit donc converger comme sa source.
edition:
  id: festival-realiste
  nom: Festival réaliste
festival:
  dateDebut: 2026-07-06
parametresSolveur:
  dureeResolutionSecondes: 1800
parametresDecoupage:
  nombreFamillesDecalage: 5
  dureeDecalageMaxMinutes: 120
  dureeChevauchementMinutes: 15
  dureeVacationCibleMinutes: 330
  dureeVacationMinMinutes: 180
  dureeVacationMaxMinutes: 360
  dureePauseRepasMinutes: 60
  fenetreRepasSoirDebut: '20:00'
  fenetreRepasSoirFin: '21:00'
  strategieCouverturePendantPause: EFFECTIF_REDUIT
decoupageAuto: {}

# Constraint dosage this scenario was verified with. The deployment default is
# neutral (1 for every constraint, see application.properties), so a scenario
# that needs a ratio carries it here. Applied as a block on import, never
# merged: a rule this section does not name comes back active at its default
# weight.
contraintes:
  poids:
    # "Privilégier le réel sur le souhaité": an appreciation mismatch is
    # eliminated before wish satisfaction is optimised, which is what the 3:1
    # ratio against souhaitsIncompatibles (left at 1) buys.
    appreciationIncompatible: 3
    # Well above the other medium constraints: past six consecutive worked
    # days the fatigue/burnout risk outweighs the rest of the "Qualité
    # d'organisation" family.
    maxJoursConsecutifsTravailles: 5

