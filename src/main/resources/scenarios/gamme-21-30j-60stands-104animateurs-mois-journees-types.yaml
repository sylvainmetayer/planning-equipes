# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 21 : un mois entier en trois journées types.
# Du jeudi 1er au vendredi 30 juillet 2027. En semaine, un après-midi ; le
# vendredi, l'après-midi et une soirée ; le week-end, matin et après-midi.
# Trente-cinq stands n'ouvrent que le week-end, quinze ferment à 18 h 30 et ne
# tiennent pas la soirée. Quatre animateurs sur dix sont des étudiants qui ne
# viennent que le week-end.

