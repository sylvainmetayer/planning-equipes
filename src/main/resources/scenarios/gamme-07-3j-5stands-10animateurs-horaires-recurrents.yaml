    heureDebut: "17:00"
    heureFin: "19:30"
  - id: J3-MATIN
    jour: 3
    date: 2027-07-31
    heureDebut: "10:00"
    heureFin: "12:30"
  - id: J3-APREM
    jour: 3
    date: 2027-07-31
    heureDebut: "14:00"
    heureFin: "17:00"
  - id: J3-FIN
    jour: 3
