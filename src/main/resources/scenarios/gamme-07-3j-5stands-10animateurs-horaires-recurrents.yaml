    heureDebut: "17:00"
    heureFin: "19:30"

stands:
  - id: BOURSE
    nom: "Bourse aux jeux"
    typologiesProposees:
      - JEUX_DE_SOCIETE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    horaires:
      - mode: OUVERTURE
        fenetres:
          - heureDebut: "10:00"
            heureFin: "12:30"
          - heureDebut: "14:00"
  - id: PODIUM
    nom: "Podium des spectacles"
    typologiesProposees:
      - SPECTACLE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    horaires:
      - mode: OUVERTURE
        jours: JOURS_SEMAINE
        joursSemaine:
          - FRIDAY
          - SATURDAY
        fenetres:
          - heureDebut: "14:00"
  - id: MEDIATHEQUE
    nom: "Médiathèque"
    typologiesProposees:
      - CONTES
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    horaires:
      - mode: FERMETURE
        fenetres:
          - heureDebut: "17:00"
        motif: "Fermeture du soir"
      - mode: FERMETURE
        jours: DATES
        dates:
          - 2027-07-31
        fenetres:
          - heureDebut: "12:00"
        motif: Inventaire
  - id: GRAND-JEU
    nom: "Grand jeu"
    typologiesProposees:
      - JEUX_DE_PISTE
    effectifMin: 1
    effectifMax: 3
    reserveMajeurs: false
    horaires:
      - mode: OUVERTURE
        jours: PLAGE
        dateDebut: 2027-07-30
        dateFin: 2027-07-31
        fenetres:
          - heureDebut: "10:00"
            heureFin: "12:30"
            effectif: 1
          - heureDebut: "14:00"
            heureFin: "19:30"
            effectif: 3
  - id: ATELIER
    nom: "Atelier créatif"
    typologiesProposees:
      - CREATIF
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    ouvertures:
      - date: 2027-07-31
        heureDebut: "10:00"
        heureFin: "12:30"
        motif: "Atelier parents-enfants"
    horaires:
      - mode: OUVERTURE
        fenetres:
          - heureDebut: "14:00"
            heureFin: "17:00"

