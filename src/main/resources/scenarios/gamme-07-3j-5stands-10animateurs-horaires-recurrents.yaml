# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 7 : les horaires récurrents, sous toutes leurs portées.
# Jeudi, vendredi, samedi ; trois vacations par jour dont deux jointives
# l'après-midi.
# - Bourse : ouverte tous les jours, coupure 12 h 30-14 h, fin « jusqu'à la fermeture ».
# - Podium : ouvert le vendredi et le samedi après-midi seulement (JOURS_SEMAINE) ;
#   le jeudi, non énoncé, est fermé.
# - Médiathèque : fermée chaque soir dès 17 h, et le samedi dès 12 h (DATES, plus
#   précise, l'emporte) — son siège du samedi matin s'arrête à midi.
# - Grand jeu : ouvert du vendredi au samedi (PLAGE), une place le matin, trois
#   l'après-midi (effectif porté par la fenêtre).
# - Atelier : ouvert l'après-midi (TOUS), mais une ouverture datée remplace la
#   règle le samedi, où il n'ouvre que le matin.

festival:
  dateDebut: 2027-07-29

creneaux:
  - id: J1-MATIN
    jour: 1
    date: 2027-07-29
    heureDebut: "10:00"
    heureFin: "12:30"
  - id: J1-APREM
    jour: 1
    date: 2027-07-29
    heureDebut: "14:00"
    heureFin: "17:00"
  - id: J1-FIN
    jour: 1
    date: 2027-07-29
    heureDebut: "17:00"
    heureFin: "19:30"
  - id: J2-MATIN
    jour: 2
