  - id: J3-APREM
    jour: 3
    date: 2027-07-25
    heureDebut: "14:00"
    heureFin: "18:00"

stands:
  - id: GRAND-JEU
    nom: "Grand jeu de piste"
    typologiesProposees:
      - JEUX_DE_PISTE
    effectifMin: 2
    effectifMax: 2
    reserveMajeurs: false
  - id: ATELIER
    nom: "Atelier créatif"
    typologiesProposees:
      - CREATIF
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
