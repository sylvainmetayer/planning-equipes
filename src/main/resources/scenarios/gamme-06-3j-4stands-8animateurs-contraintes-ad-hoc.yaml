# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 6 : les quatre types de contraintes ad hoc, avec et sans périmètre.
# Tout le monde sait tout faire, pour que seules les exceptions décident :
# une indisponibilité forcée sur un stand et une autre sur un créneau, deux
# animateurs incompatibles, une affectation forcée sur un créneau et une autre
# sur un stand, un binôme à réunir sur le grand jeu (deux places).

festival:
  dateDebut: 2027-07-23

creneaux:
  - id: J1-MATIN
    jour: 1
    date: 2027-07-23
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J1-APREM
    jour: 1
    date: 2027-07-23
    heureDebut: "14:00"
    heureFin: "18:00"
  - id: J2-MATIN
    jour: 2
