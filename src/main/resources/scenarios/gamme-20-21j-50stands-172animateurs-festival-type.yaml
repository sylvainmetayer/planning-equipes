# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 20 : trois semaines d'un festival comme on en organise.
# Une rotation du midi saisie en vacations (12 h-13 h et 13 h-14 h à effectif
# réduit), des nocturnes jusqu'à 23 h 30 les vendredis et samedis, quinze stands
# premium, dix épuisants, cinq réservés aux majeurs, huit emplacements, six
# polyvalents, des souhaits pour six animateurs sur dix. Les quinze stands d'une
# place ferment sur le temps du midi plutôt que d'ouvrir un demi-siège.

