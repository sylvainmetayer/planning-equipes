# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
festival:
  dateDebut: 2026-07-08

# Fixture for PlanningServiceScenarioFromTextTest: the two sections that tune
# the constraint catalogue for this festival — which rules are switched off,
# what the others weigh — plus the hand-entered constraints, which used to be
# the only part of a scenario that stayed behind on export.
contraintes:
  desactivees:
    - eviterRoulementStandsPremium
  poids:
    equilibrerCharge: 35
    maxJoursConsecutifsTravailles: 15

creneaux:
  - id: J1-MATIN
    jour: 1
    date: 2026-07-08
    heureDebut: "09:00"
    heureFin: "13:00"

stands:
  - id: STAND-STRAT
    nom: Stand stratégie
    typologiesProposees:
      - STRATEGIE
    effectifMin: 1
    effectifMax: 2
    reserveMajeurs: false

animateurs:
  - id: A1
    prenom: Alice
    nom: Referente
    dateNaissance: 2002-07-19
    manager: false
    competences:
      STRATEGIE: REFERENT
    joursIndisponibles: []
  - id: A2
    prenom: Bob
    nom: Debutant
    dateNaissance: 2001-03-04
    manager: false
    competences:
      STRATEGIE: DEBUTANT
    joursIndisponibles: []

contraintesAdHoc:
  - id: INCOMPAT-1
    type: INCOMPATIBILITE
    animateurs:
      - A1
      - A2
    raison: Ne travaillent pas ensemble
  - id: INDISPO-1
    type: INDISPONIBILITE_FORCEE
    animateurs:
      - A2
    creneauId: J1-MATIN
    standId: STAND-STRAT
    raison: Formation
