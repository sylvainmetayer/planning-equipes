# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 24 : un mois sur douze emplacements, avec un cinquième de mineurs.
# Du lundi 12 juillet au mardi 10 août 2027, 14 juillet compris. Les stands sont
# regroupés par dix sur douze emplacements répartis sur deux kilomètres : changer
# d'emplacement entre deux vacations se paie, en visiter trop dans la journée
# aussi. Un stand de deux places sur trois au moins, pour que les mineurs aient
# toujours un majeur à côté d'eux.

festival:
  dateDebut: 2027-07-12

contraintes:
  poids:
    eviterChangementEmplacementEloigne: 2
    limiterEmplacementsParJour: 2
    repartitionMineursParCreneau: 2
    maxJoursConsecutifsTravailles: 5

