schemaVersion: 2
# Barreau 2 : la rotation du midi, saisie comme une organisation la tape.
# Une journée type en quatre vacations jointives dont deux vacations de midi.
# Quatre animateurs pour deux places par vacation, deux stands d'une personne :
# un problème minuscule, qui exerce la saisie d'une journée type et la coupure
# repas autour de midi.

festival:
  dateDebut: 2027-07-04

creneaux:
  - id: J1-MATIN
    jour: 1
    date: 2027-07-04
    heureDebut: "10:00"
    heureFin: "12:00"
  - id: J1-MIDI1
    jour: 1
    date: 2027-07-04
    heureDebut: "12:00"
    heureFin: "13:00"
  - id: J1-MIDI2
    jour: 1
    date: 2027-07-04
    heureDebut: "13:00"
    heureFin: "14:00"
  - id: J1-APREM
    jour: 1
    date: 2027-07-04
    heureDebut: "14:00"
    heureFin: "18:00"

journeesTypes:
  - nom: "Journée unique"
    vacations:
      - heureDebut: "10:00"
        heureFin: "12:00"
      - heureDebut: "12:00"
        heureFin: "13:00"
      - heureDebut: "13:00"
        heureFin: "14:00"
      - heureDebut: "14:00"
        heureFin: "18:00"
    dates:
      - 2027-07-04

stands:
  - id: MOTRICITE
    nom: "Parcours de motricité"
    typologiesProposees:
      - MOTRICITE
    effectifMin: 1
    effectifMax: 2
    reserveMajeurs: false
  - id: PLATEAU
    nom: "Jeux de plateau"
    typologiesProposees:
      - JEUX_DE_SOCIETE
    effectifMin: 1
    effectifMax: 2
    reserveMajeurs: false

animateurs:
