# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
festival:
  dateDebut: 2026-08-01

# dureeVacationMinMinutes: commit 9529a91 (message references its
# pre-amend hash 092d9ae) set this to 250, not the 180 default, and verified
# 0 hard on this scenario at the time. A later pass (d06723f) silently
# regressed it to 240 with no re-verification. Restored to 250 here, but on
# its own it is no longer sufficient to reach 0 hard on this scenario as it
# stands today (verified: 250 alone still leaves ~49 hard, same order as 240's
# ~51-57) — 28 commits happened between 9529a91 and now, including this same
# session's reposHebdomadaireMineur fix (2026-07-15 added to 18 minors below),
# which adds its own share of the remaining pressure. Restoring 250 is kept
# anyway since it is still the documented-correct value and part of the fix;
# the rest of the gap is closed by the extra animateurs added at the end of
# this file (see their comment). The other fields below were folded in by
# d06723f and match ParametresDecoupage's own defaults, so they are harmless —
# only dureeVacationMinMinutes actually matters here.
# Le découpage de cette amplitude produit des vacations qui se touchent
# (10:00-12:05, 12:05-13:05, 13:05-14:10 …). Laisser la pause minimale entre
# vacations à 30 min interdirait de les enchaîner, et la relève de midi
# exigerait une équipe entière de plus — c'est le réglage que l'aide en ligne
# recommande pour une grille en blocs jointifs.
parametresLegaux:
  pauseMinimaleEntreVacationsMinutes: 0

parametresDecoupage:
  dureeChevauchementMinutes: 30
  dureePauseRepasMinutes: 60
  dureeVacationCibleMinutes: 180
  dureeVacationMaxMinutes: 360
  dureeVacationMinMinutes: 250
  fenetreRepasMidiDebut: 12:00:00
  fenetreRepasMidiFin: 14:00:00
  fenetreRepasSoirDebut: 19:00:00
  fenetreRepasSoirFin: 21:00:00
  strategieCouverturePendantPause: RELEVE

# Constraint dosage this scenario was verified with. The deployment default is
# neutral (1 for every constraint, see application.properties), so a scenario
# that needs a ratio carries it here. Applied as a block on import, never
# merged: a rule this section does not name comes back active at its default
# weight.
# Le fichier ne porte qu'une amplitude brute par jour : c'est le découpage qui
# en fait un vrai problème de staffing (relais chevauchants, pause repas), et
# c'est ce que cette fixture teste. Sans cette section, l'import laisserait les
# amplitudes telles quelles et le scénario ne serait plus « continu » du tout.
# Pas de section postes en face : un scénario découpé à l'import ne peut pas
# épingler des sièges sur des créneaux qui n'existent pas encore.
decoupageAuto: {}

contraintes:
  poids:
    # "Privilégier le réel sur le souhaité": an appreciation mismatch is
    # eliminated before wish satisfaction is optimised, which is what the 3:1
    # ratio against souhaitsIncompatibles (left at 1) buys.
    appreciationIncompatible: 3
    # Well above the other medium constraints: past six consecutive worked
    # days the fatigue/burnout risk outweighs the rest of the "Qualité
    # d'organisation" family.
    maxJoursConsecutifsTravailles: 5

