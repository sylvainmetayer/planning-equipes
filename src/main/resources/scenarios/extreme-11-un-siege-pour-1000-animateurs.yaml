# Cas dégénéré 11 : un seul siège, mille animateurs.
# Le plus petit problème possible avec le plus grand effectif : un siège est
# pourvu, neuf cent quatre-vingt-dix-neuf personnes ne travaillent pas, et
# l'équité de charge n'a rien à répartir.

