# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Chaque jour porte 3 créneaux (MATIN/APREM/SOIREE) espacés d'au moins 30 min
# (pauseMinimaleEntreVacations) et avec au moins 11 h entre la SOIREE d'un
# jour et le MATIN du lendemain (reposQuotidienMinimal, art. L3131-1) —
# sinon un animateur enchaînant deux créneaux du même jour ou consécutifs
# viole systématiquement l'une de ces contraintes dures, ce qui a fait
# exploser le temps de résolution (voir PlanningServiceScenarioCompletTest).
festival:
  dateDebut: 2026-07-08

# No postes section: the seats this scenario staffs are exactly the ones the
# import generates from its stands and créneaux — sum(effectifMin) x créneaux,
# 2088, plus the 24 the Homme-jeu stand's dated openings imply (issue #93).
# Enumerating them by hand added 8 400 lines saying what effectifMin already
# said, and a hand list that drifts from the stands is a fixture that no longer
# describes the problem it claims to.
#
# 2112 postes: reaching a good score takes ~6-8 min, well above the 180 s
# Débogage default — pin it here so importing this scenario auto-configures the
# solver's termination duration instead of under-timing every solve. 480 s is a
# budget for score quality, not for feasibility: 0 hard is now reached in ~12 s
# (383 s back when this file enumerated its own seats — the generated order
# converges much faster).
parametresSolveur:
  dureeResolutionSecondes: 480

# Constraint dosage this scenario was verified with. The deployment default is
# neutral (1 for every constraint, see application.properties), so a scenario
# that needs a ratio carries it here. Applied as a block on import, never
# merged: a rule this section does not name comes back active at its default
# weight.
contraintes:
  poids:
    # "Privilégier le réel sur le souhaité": an appreciation mismatch is
    # eliminated before wish satisfaction is optimised, which is what the 3:1
    # ratio against souhaitsIncompatibles (left at 1) buys.
    appreciationIncompatible: 3
    # Well above the other medium constraints: past six consecutive worked
    # days the fatigue/burnout risk outweighs the rest of the "Qualité
    # d'organisation" family.
    maxJoursConsecutifsTravailles: 5

