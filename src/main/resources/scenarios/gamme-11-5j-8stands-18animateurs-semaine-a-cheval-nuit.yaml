# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 11 : une édition à cheval sur deux semaines civiles, et des soirées
# qui passent minuit.
# Du vendredi au mardi. Samedi et dimanche, une soirée jeux de 21 h à 1 h du
# matin, que seul le bar à jeux (réservé aux majeurs) tient : la fenêtre
# d'ouverture « jusqu'à la fermeture » suit le créneau au-delà de minuit. La durée
# hebdomadaire maximale est ramenée à 30 h, et le dimanche soir compte dans la
# semaine qui s'achève. Qui finit à 1 h ne reprend pas avant midi.

