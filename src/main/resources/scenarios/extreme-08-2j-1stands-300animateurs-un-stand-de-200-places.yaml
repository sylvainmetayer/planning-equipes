# Scénario extrême 8 : un seul stand de deux cents places.
# Un week-end, deux cents sièges identiques par vacation sur le même stand et le
# même créneau : les règles qui regroupent par stand et par créneau (encadrement
# des mineurs, mixité des niveaux, référent) jugent des groupes de deux cents.

festival:
  dateDebut: 2028-06-24

creneaux:
  - id: J1-MATIN
    jour: 1
    date: 2028-06-24
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J1-APREM
    jour: 1
    date: 2028-06-24
    heureDebut: "14:00"
    heureFin: "18:00"
  - id: J2-MATIN
    jour: 2
    date: 2028-06-25
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J2-APREM
    jour: 2
    date: 2028-06-25
    heureDebut: "14:00"
    heureFin: "18:00"

