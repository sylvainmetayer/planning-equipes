# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Identical to scenario-continu.yaml (see PlanningServiceScenarioContinuTest),
# except three stands each carry one partial-créneau closure
# (IndisponibiliteStand, issue #60) on a different mid-festival day: STAND-01
# (2026-07-10, 14:00-16:00), STAND-05 (2026-07-16, 13:00-15:00) and STAND-12
# (2026-07-11, 15:00-18:00) — none on 2026-07-14, already legally special
# (Fête nationale, see JoursFeries) for the minors this scenario schedules.
festival:
  dateDebut: 2026-08-01

# dureeVacationMinMinutes: commit 9529a91 (message references its
# pre-amend hash 092d9ae) set this to 250, not the 180 default, and verified
# 0 hard on this scenario at the time. A later pass (d06723f) silently
# regressed it to 240 with no re-verification. Restored to 250 here, but on
# its own it is no longer sufficient to reach 0 hard on this scenario as it
# stands today (verified: 250 alone still leaves ~49 hard, same order as 240's
# ~51-57) — 28 commits happened between 9529a91 and now, including this same
# session's reposHebdomadaireMineur fix (2026-07-15 added to 18 minors below),
# which adds its own share of the remaining pressure. Restoring 250 is kept
# anyway since it is still the documented-correct value and part of the fix;
# the rest of the gap is closed by the extra animateurs added at the end of
# this file (see their comment). The other fields below were folded in by
# d06723f and match ParametresDecoupage's own defaults, so they are harmless —
# only dureeVacationMinMinutes actually matters here.
parametresDecoupage:
  dureeChevauchementMinutes: 30
  dureePauseRepasMinutes: 45
  dureeVacationCibleMinutes: 180
  dureeVacationMaxMinutes: 360
  dureeVacationMinMinutes: 250
  fenetreRepasMidiDebut: 12:00:00
  fenetreRepasMidiFin: 14:00:00
  fenetreRepasSoirDebut: 19:00:00
  fenetreRepasSoirFin: 21:00:00
  strategieCouverturePendantPause: RELEVE

