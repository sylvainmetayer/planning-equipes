# Barreau infaisable 3 : le mur des six jours.
# Une semaine civile entière, du lundi au dimanche, trois places par jour et trois
# animateurs. Chaque jour pris isolément est couvert, et l'analyse de faisabilité
# — agrégée par vacation — répond « réalisable ». Mais personne ne travaille
# sept jours dans la semaine : il manque trois personnes-jours.

