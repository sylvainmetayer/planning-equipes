# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 25, le sommet de la gamme : un mois, cent cinquante stands, tout ce
# qu'un fichier de scénario sait dire.
# Juillet 2027. Trois journées types (semaine, vendredi avec soirée, week-end avec
# rotation du midi) ; des stands ouverts toute l'édition, d'autres le week-end
# seulement, d'autres pendant deux semaines (PLAGE) ; des effectifs portés par la
# fenêtre ; des fermetures d'une heure qui coupent l'après-midi en deux ;
# quinze emplacements ; trente stands premium, vingt épuisants, dix réservés aux
# majeurs ; un sixième de mineurs, le 14 juillet férié ; dix polyvalents ; des
# étudiants du week-end et des saisonniers de deux semaines ; des souhaits, des
# contraintes ad hoc, un dosage, une durée de résolution et une édition cible.

edition:
  id: GAMME-25
  nom: "Gamme 25 — édition complète"

festival:
