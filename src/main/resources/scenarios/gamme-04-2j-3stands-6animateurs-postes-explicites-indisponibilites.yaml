# yaml-language-server: $schema=../../../../docs/schema/scenario-schema.json
# Barreau 4 : un week-end, des sièges écrits à la main et des indisponibilités.
# La section postes est présente, donc reprise telle quelle : le stand Dominos
# ouvre deux places le samedi après-midi alors que son effectif minimum est 1.
# Le Kapla ferme le dimanche à 16 h 30 (livraison) : son siège de l'après-midi
# ne court que de 14 h à 16 h 30. Le Quiz n'ouvre que le samedi de 14 h à 17 h.
# Deux animateurs sont indisponibles, chacun un des deux jours.

festival:
  dateDebut: 2027-07-10

creneaux:
  - id: J1-MATIN
    jour: 1
    date: 2027-07-10
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J1-APREM
    jour: 1
    date: 2027-07-10
    heureDebut: "14:00"
    heureFin: "18:30"
  - id: J2-MATIN
    jour: 2
    date: 2027-07-11
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J2-APREM
    jour: 2
    date: 2027-07-11
    heureDebut: "14:00"
    heureFin: "18:30"

stands:
  - id: KAPLA
    nom: Kapla
    typologiesProposees:
      - CONSTRUCTION
    effectifMin: 1
    effectifMax: 2
    reserveMajeurs: false
    indisponibilites:
      - date: 2027-07-11
        heureDebut: "16:30"
        motif: "Livraison de matériel"
  - id: QUIZ
    nom: "Quiz musical"
    typologiesProposees:
      - CULTURE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    ouvertures:
      - date: 2027-07-10
        heureDebut: "14:00"
        heureFin: "17:00"
        motif: "Animation du samedi"
  - id: DOMINOS
    nom: "Dominos géants"
    typologiesProposees:
      - JEUX_DE_SOCIETE
    effectifMin: 1
    effectifMax: 3
    reserveMajeurs: false

animateurs:
  - id: A013
    prenom: Jade
    nom: Moulin
    dateNaissance: 1992-02-02
    manager: false
    email: "animateur013@example.org"
    competences:
      CONSTRUCTION: REFERENT
      JEUX_DE_SOCIETE: AUTONOME
    joursIndisponibles:
      - 2027-07-10
  - id: A014
    prenom: Gabriel
    nom: Cordier
    dateNaissance: 1996-06-06
    manager: false
    email: "animateur014@example.org"
    competences:
      CULTURE: AUTONOME
      JEUX_DE_SOCIETE: AUTONOME
    joursIndisponibles:
      - 2027-07-11
  - id: A015
    prenom: Louise
    nom: Poirier
    dateNaissance: 1980-12-12
    manager: false
    email: "animateur015@example.org"
    competences:
      CONSTRUCTION: AUTONOME
      CULTURE: REFERENT
    joursIndisponibles: []
  - id: A016
    prenom: "Raphaël"
    nom: Girard
