# Dix sièges : un de plus que ce que effectifMin générerait sur Dominos le samedi après-midi.
postes:
  - id: P-KAPLA-J1-MATIN
    standId: KAPLA
    creneauId: J1-MATIN
  - id: P-KAPLA-J1-APREM
    standId: KAPLA
    creneauId: J1-APREM
  - id: P-KAPLA-J2-MATIN
    standId: KAPLA
    creneauId: J2-MATIN
  - id: P-KAPLA-J2-APREM
