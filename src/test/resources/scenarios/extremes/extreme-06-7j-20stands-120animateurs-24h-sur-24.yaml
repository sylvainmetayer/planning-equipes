# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Scénario extrême 6 : une semaine en exploitation continue, jour et nuit.
# Six vacations de quatre heures qui couvrent les vingt-quatre heures, la
# dernière finissant à minuit. Repos quotidien de onze heures, travail de nuit,
# coupures repas du midi et du soir, six jours par semaine : les majeurs seuls
# tiennent la nuit, et une fin de vacation à minuit ne se reprend pas à quatre
# heures.

