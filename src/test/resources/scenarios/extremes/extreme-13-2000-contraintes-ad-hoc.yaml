# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Cas dégénéré 13 : deux mille contraintes ad hoc sur une semaine.
# Deux cents affectations forcées (une par personne), cinq cents incompatibilités,
# trois cents affinités et mille indisponibilités forcées sur un stand, tirées
# pour qu'aucune ne contredise une autre. Le contrôle des contradictions compare
# les exceptions deux à deux : c'est lui, autant que le solve, que ce fichier
# mesure.

