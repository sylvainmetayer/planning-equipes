# Barreau infaisable 5 : une grille que la coupure repas ne peut pas traverser.
# Une seule vacation de 10 h à 20 h couvre toute la fenêtre du midi : son
# titulaire travaille de part et d'autre et ne peut pas s'absenter, et le siège
# doit être pourvu. La pause légale est déclarée prise sur le poste, si bien que
# seule la coupure repas est en défaut — la durée quotidienne déduit ses vingt
# minutes de pause et reste sous dix heures.

festival:
  dateDebut: 2027-09-11

parametresLegaux:
  pauseSurPoste: true

creneaux:
  - id: J1-JOURNEE
    jour: 1
    date: 2027-09-11
    heureDebut: "10:00"
    heureFin: "20:00"

stands:
  - id: ACCUEIL
    nom: "Accueil des familles"
    typologiesProposees:
      - JEUX_DE_SOCIETE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false

animateurs:
