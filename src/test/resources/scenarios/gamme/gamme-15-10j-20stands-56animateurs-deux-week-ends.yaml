# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 15 : deux semaines de mercredi à dimanche, et une équipe qui n'est pas
# disponible pareil tous les jours.
# Deux journées types : l'après-midi de semaine, et le week-end avec sa rotation
# de midi. Huit stands n'ouvrent que le week-end. Le lundi et le mardi sont des
# jours creux, dans l'événement mais sans créneau. Quinze étudiants ne viennent
# que le week-end, dix animateurs manquent l'un des deux week-ends.

festival:
  dateDebut: 2027-06-02

parametresDecoupage:
  modeGrille: VACATIONS

parametresLegaux:
