# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 9 : le référentiel des typologies, les polyvalents et les distances.
# Six typologies déclarées avec libellé, plus la typologie ninja POLYVALENT :
# trois animateurs la portent et peuvent tenir n'importe quel stand. Le cirque et
# la robotique n'ont chacun qu'un spécialiste ; tout le reste de leurs sièges
# revient aux polyvalents. Trois emplacements, dont un gymnase à 1,6 km du parc,
# pour que les règles de distance et d'emplacements par jour aient à arbitrer.

festival:
  dateDebut: 2027-08-26

typologies:
  - id: CIRQUE
    label: "Arts du cirque"
  - id: ROBOTIQUE
    label: Robotique
  - id: JEUX_DE_SOCIETE
    label: "Jeux de société"
  - id: CONSTRUCTION
    label: Construction
  - id: CONTES
    label: Contes
  - id: JEUX_DE_PISTE
    label: "Jeux de piste"
  - id: POLYVALENT
    label: Polyvalent
    ninja: true

emplacements:
  - id: PARC
    nom: "Parc municipal"
    latitude: "45.0"
    longitude: "1.0"
  - id: HALLE
    nom: "Halle du marché"
    latitude: "45.002"
    longitude: "1.001"
  - id: GYMNASE
    nom: Gymnase
    latitude: "45.011"
    longitude: "1.015"

creneaux:
  - id: J1-MATIN
    jour: 1
    date: 2027-08-26
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J1-APREM
    jour: 1
    date: 2027-08-26
    heureDebut: "14:00"
    heureFin: "18:00"
  - id: J2-MATIN
    jour: 2
    date: 2027-08-27
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J2-APREM
    jour: 2
    date: 2027-08-27
    heureDebut: "14:00"
    heureFin: "18:00"
  - id: J3-MATIN
    jour: 3
    date: 2027-08-28
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J3-APREM
    jour: 3
    date: 2027-08-28
    heureDebut: "14:00"
    heureFin: "18:00"
  - id: J4-MATIN
    jour: 4
    date: 2027-08-29
    heureDebut: "10:00"
    heureFin: "13:00"
  - id: J4-APREM
    jour: 4
    date: 2027-08-29
    heureDebut: "14:00"
    heureFin: "18:00"

stands:
  - id: CIRQUE
    nom: "Initiation au cirque"
    typologiesProposees:
      - CIRQUE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    niveauEffort: EPUISANT
    emplacementId: GYMNASE
  - id: ROBOTIQUE
    nom: "Atelier robotique"
    typologiesProposees:
      - ROBOTIQUE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    emplacementId: HALLE
  - id: PLATEAU
    nom: "Jeux de plateau"
    typologiesProposees:
      - JEUX_DE_SOCIETE
    effectifMin: 2
    effectifMax: 2
    reserveMajeurs: false
    emplacementId: PARC
  - id: CONSTRUCTION
    nom: "Jeux de construction"
    typologiesProposees:
      - CONSTRUCTION
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    emplacementId: PARC
  - id: LECTURE
    nom: "Coin lecture"
    typologiesProposees:
      - CONTES
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
    emplacementId: HALLE
  - id: GRAND-JEU
    nom: "Grand jeu de piste"
    typologiesProposees:
      - JEUX_DE_PISTE
    effectifMin: 2
    effectifMax: 2
    reserveMajeurs: false
    emplacementId: GYMNASE

