# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 19 : trois semaines, une équipe saisonnière, des stands qui arrivent en
# cours de route.
# Du lundi 5 au dimanche 25 juillet 2027, 14 juillet compris. Trois animateurs
# sur dix partent après la deuxième semaine, trois autres n'arrivent qu'à la
# deuxième ; les autres ont quelques jours d'absence. Huit stands n'ouvrent que
# les deux dernières semaines (PLAGE), sept que le week-end.

festival:
  dateDebut: 2027-07-05

contraintes:
  poids:
    maxJoursConsecutifsTravailles: 5

