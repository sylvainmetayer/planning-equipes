# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 13 : stands premium et stands épuisants, un dosage qui les arbitre.
# Quatre stands premium (continuité d'équipe, pas de débutant), trois stands
# épuisants (pas d'enchaînement de deux), cinq stands ordinaires. Seize
# animateurs ne sont que débutants sur les typologies premium, quatorze y sont
# autonomes ou référents. Le fichier porte le dosage sous lequel il a été vérifié.

festival:
  dateDebut: 2027-08-23

contraintes:
  poids:
    experienceRequisePourStandsPremium: 3
    eviterRoulementStandsPremium: 2
    eviterEnchainementStandsEpuisants: 2
    appreciationIncompatible: 3
    maxJoursConsecutifsTravailles: 5

