# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 16 : deux semaines avec un tiers de mineurs, un jour férié et des
# nocturnes.
# Du lundi 9 au dimanche 22 août 2027. Le 15 août tombe un dimanche : aucun
# mineur ne travaille ce jour-là. Les vendredis et samedis, une nocturne de 20 h
# à 23 h que seuls cinq stands tiennent, dont deux bars réservés aux majeurs ;
# elle empiète sur la nuit légale de tous les mineurs. Les dix stands de deux
# places sont les seuls où un mineur trouve un majeur à côté de lui.
# Qui ferme la nocturne à 23 h peut rouvrir à 10 h : onze heures pile.

festival:
  dateDebut: 2027-08-09

contraintes:
  poids:
    appreciationIncompatible: 3
    repartitionMineursParCreneau: 2
    maxJoursConsecutifsTravailles: 5

