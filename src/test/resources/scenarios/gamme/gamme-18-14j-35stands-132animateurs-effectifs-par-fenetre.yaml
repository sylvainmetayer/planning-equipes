# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 18 : l'effectif porté par la fenêtre, pas par le stand.
# Trois vacations par jour. Cinq profils de stand, sept stands chacun :
# - une place le matin, deux l'après-midi ;
# - deux fenêtres qui se recouvrent de 14 h à 18 h, où le plus haut effectif
#   l'emporte ;
# - ouvert à partir de 14 h « jusqu'à la fermeture » ;
# - toujours ouvert, mais fermé une heure (15 h-16 h) trois jours tirés au sort :
#   l'après-midi de ces jours-là porte deux groupes de sièges ;
# - trois places le matin, une l'après-midi, fermé le soir.

