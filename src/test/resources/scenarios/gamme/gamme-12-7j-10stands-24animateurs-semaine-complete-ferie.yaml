# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 12 : une semaine civile entière, un jour férié et des mineurs.
# Du lundi 12 au dimanche 18 juillet 2027 : personne ne travaille plus de six
# jours, et les cinq mineurs gardent deux jours de repos consécutifs dans la
# semaine. Le 14 juillet est férié : aucun mineur ne travaille ce jour-là.
# Les mineurs n'ont de place que sur les deux stands de deux personnes, auprès
# d'un majeur. Au-delà de cinq jours consécutifs, le coût monte (poids 5).

festival:
  dateDebut: 2027-07-12

contraintes:
  poids:
    maxJoursConsecutifsTravailles: 5

