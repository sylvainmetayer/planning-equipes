# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 14 : dix jours découpés, relève pendant le repas, coupure de 45 min.
# Amplitudes 13 h-19 h en semaine, 10 h-19 h le week-end ; le découpage vise des
# vacations de quatre heures (entre 1 h 30 et 5 h) qui se recouvrent d'un quart
# d'heure à la relève. Le week-end, la première engloutirait la fenêtre repas :
# le découpage y coupe et pose une vacation de relève à effectif plein pendant la
# pause (RELEVE). La coupure repas vaut 45 minutes dans la fenêtre 12 h-14 h.
# L'édition traverse un week-end et deux frontières de semaine.

festival:
  dateDebut: 2027-08-30

parametresDecoupage:
  dureeVacationCibleMinutes: 240
  dureeVacationMinMinutes: 90
  dureeVacationMaxMinutes: 300
  dureeChevauchementMinutes: 15
  strategieCouverturePendantPause: RELEVE

parametresLegaux:
  coupureRepasMinutes: 45

decoupageAuto: {}

