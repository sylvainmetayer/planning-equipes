# Barreau infaisable 2 : une exception qui contredit une indisponibilité.
# L'affectation forcée du matin tombe un jour où l'animatrice qu'elle nomme
# s'est déclarée indisponible. Le contrôle des contradictions ne compare que les
# exceptions entre elles : le fichier est accepté, mais l'analyse de faisabilité
# le signale comme cause bloquante, et le solve garde le jour d'indisponibilité —
# c'est l'exception qui n'est pas tenue.

