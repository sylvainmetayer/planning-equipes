# yaml-language-server: $schema=../../../../../docs/schema/scenario-schema.json
# Barreau 8 : une grille en amplitudes, découpée à l'import.
# Une amplitude par jour, de 10 h à 19 h ; decoupageAuto la tranche en vacations
# d'environ quatre heures (entre deux et cinq), sans chevauchement. Une vacation
# de quatre heures ouverte à 10 h engloutirait la fenêtre repas de midi : le
# découpage y coupe, et pose pendant la pause une vacation à effectif réduit
# (EFFECTIF_REDUIT, moitié arrondie au supérieur). Les vacations découpées se
# touchent : la pause minimale est à 0.

festival:
  dateDebut: 2027-08-18

parametresDecoupage:
  dureeVacationCibleMinutes: 240
  dureeVacationMinMinutes: 120
  dureeVacationMaxMinutes: 300
  dureeChevauchementMinutes: 0
  strategieCouverturePendantPause: EFFECTIF_REDUIT

parametresLegaux:
  pauseMinimaleEntreVacationsMinutes: 0

decoupageAuto: {}

creneaux:
  - id: J1-AMPLITUDE
    jour: 1
    date: 2027-08-18
    heureDebut: "10:00"
    heureFin: "19:00"
  - id: J2-AMPLITUDE
    jour: 2
    date: 2027-08-19
    heureDebut: "10:00"
    heureFin: "19:00"
  - id: J3-AMPLITUDE
    jour: 3
    date: 2027-08-20
    heureDebut: "10:00"
    heureFin: "19:00"

stands:
  - id: PLATEAU
    nom: "Jeux de plateau"
    typologiesProposees:
      - JEUX_DE_SOCIETE
    effectifMin: 2
    effectifMax: 2
    reserveMajeurs: false
  - id: CONSTRUCTION
    nom: "Jeux de construction"
    typologiesProposees:
      - CONSTRUCTION
    effectifMin: 2
    effectifMax: 2
    reserveMajeurs: false
  - id: QUIZ
    nom: Quiz
    typologiesProposees:
      - CULTURE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
  - id: PALETS
    nom: "Palets bretons"
    typologiesProposees:
      - ADRESSE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false
  - id: PUZZLE
    nom: "Puzzles géants"
    typologiesProposees:
      - JEUX_DE_SOCIETE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false

