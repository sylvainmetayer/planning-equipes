festival:
  dateDebut: 2026-07-08

# Fixture for ReferenceDataResourceDecoupageAutoFamillesTest: the same
# amplitude-only shape as scenario-decoupage-auto.yaml, but the scenario also
# pins its own parametresDecoupage — including the staggered relay grid.
#
# The point of the fixture is the ORDER: the importer must apply
# parametresDecoupage *before* running the auto-slicing, otherwise the
# vacations are generated with whatever was configured beforehand and the
# scenario's own settings only take effect on the next manual regeneration.
# A dense scenario that only solves with a staggered grid (see
# docs/optimisation-solveur.md) depends entirely on that ordering.
parametresDecoupage:
  nombreFamillesDecalage: 3
  dureeDecalageMaxMinutes: 60
  dureeChevauchementMinutes: 15
  dureePauseRepasMinutes: 60

decoupageAuto:
  groupeSourceNom: "Amplitudes familles"
  groupeCibleNom: "Vacations familles"

creneaux:
  - id: J1-JOUR
    jour: 1
    date: 2026-07-08
    heureDebut: "10:00"
    heureFin: "00:00"

stands:
  - id: STAND-STRAT
    nom: Stand stratégie
    typologiesProposees:
      - STRATEGIE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false

animateurs:
  - id: A1
    prenom: Alice
    nom: Referente
    dateNaissance: 2002-07-19
    manager: false
    competences:
      STRATEGIE: REFERENT
    joursIndisponibles: []
