festival:
  dateDebut: 2026-07-08

# Fixture for the decoupageAuto scenario section: a scenario written
# straight in "amplitudes" (one 14h opening window, journée + nocturne
# merged, same shape as scenario-continu.yaml) that asks its import to
# auto-slice itself into vacations instead of leaving the operator to run
# the "Découpage" screen by hand afterwards.
decoupageAuto:
  groupeSourceNom: "Amplitudes import auto"
  groupeCibleNom: "Vacations import auto"

creneaux:
  - id: J1-JOUR
    jour: 1
    date: 2026-07-08
    heureDebut: "10:00"
    heureFin: "00:00"

stands:
  - id: STAND-STRAT
    nom: Stand stratégie
    typologiesProposees:
      - STRATEGIE
    effectifMin: 1
    effectifMax: 1
    reserveMajeurs: false

animateurs:
  - id: A1
    prenom: Alice
    nom: Referente
    dateNaissance: 2002-07-19
    manager: false
    competences:
      STRATEGIE: REFERENT
    joursIndisponibles: []

postes:
  - id: P1
    standId: STAND-STRAT
    creneauId: J1-JOUR
    animateurId: null
