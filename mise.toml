[tools]
"github:github/copilot-cli" = "latest"
java = "temurin-25"
node = "24"
maven = "3.10.1"
quarkus = "3.40.1"
ggshield = "latest"
git-cliff = "latest"

[tasks.clean_dev]
run = "podman compose down -v && podman volume prune && podman compose up -d"
interactive = true

[tasks.dev]
run = "podman compose up -d"

[tasks.site]
description = "Vitrine (site/) : installe les dépendances si besoin et lance le serveur Eleventy (http://localhost:8080)"
dir = "site"
run = "mise run dev"

[env]
MAIL_ADMIN="admin@localhost"
