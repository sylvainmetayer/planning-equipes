# Root services load their state when first injected, without awaiting and
# with their error handled: a root service has no ngOnInit, and an app
# initializer would hold the whole start-up on that request.
sonar.issue.ignore.multicriteria.rootserviceload.ruleKey=typescript:S7059
sonar.issue.ignore.multicriteria.rootserviceload.resourceKey=src/main/webui/src/app/core/date-mock.service.ts
sonar.issue.ignore.multicriteria.rootsettingsload.ruleKey=typescript:S7059
