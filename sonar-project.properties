sonar.issue.ignore.multicriteria.rowclick.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.rowclick.resourceKey=src/main/webui/src/app/pages/fragilite/fragilite-page.html

# The two links sit in the exclusive branches of one @if/@else: only one
