# SonarCloud analysis, run by the `sonar` job of the Tests workflow
# (.github/workflows/tests.yml) once the backend and frontend suites have
# produced their coverage. Automatic analysis is switched off on SonarCloud:
# it read neither the coverage nor the exclusions below.

sonar.organization=sylvainmetayer-github
sonar.projectKey=sylvainmetayer_planning-equipes
sonar.projectName=planning-equipes

# Production code and tests are told apart, so coverage counts the former only.
sonar.sources=.
sonar.exclusions=src/test/**,src/main/webui/src/**/*.spec.ts,src/main/webui/e2e/**,**/node_modules/**,target/**,src/main/webui/dist/**,src/main/webui/coverage/**,src/main/webui/.angular/**,.quinoa/**
sonar.tests=src/test,src/main/webui/src,src/main/webui/e2e
sonar.test.inclusions=src/test/**,src/main/webui/src/**/*.spec.ts,src/main/webui/e2e/**

# Java: the classes the `test` job compiled, and the dependencies the `sonar`
# job resolves into target/sonar-libraries.txt.
sonar.java.source=25
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage: JaCoCo for the backend (-Pcoverage), Vitest's lcov for the frontend
# (npm run test:coverage).
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=src/main/webui/coverage/**/lcov.info

# Every exclusion below carries its reason: a rule is silenced only where
# following it would break a repository rule or the thing the file is for.

sonar.issue.ignore.multicriteria=flyway,mailtables,fixturerandom,cliargs,mcptoolargs,tsconfigjsonc,iconfont,scriptspath,clistdout,businesserror,defaultsecret,referentialfacade,notificationpush,localsolver,localdomain,localpauses,timefoldcollector,ouvertureidentity,structdoc,structlang,structiso,structjournal,structrefus,structgel,structparams,angularlock,ghcrpassword,e2epassword,bulksequential,reglessequential,rootserviceload,rootsettingsload,rowclick,ifelselink,nullcontract1,nullcontract2,nullcontract3,nullcontract4,nullcontract5,localanalyse1,localanalyse2,tablenames1,tablenames2,setvalbatch,nullablefn1,nullablefn2,nullablefn3,sweepclass,plainctor,whatif,snakeyamldate,keptlambda1,keptlambda2,sideloops1,sideloops2,sideloops3,sideloops4,sideloops5,sideloops6,sideloops7,sideloops8

# Applied Flyway migrations are frozen (FlywayMigrationsFrozenTest refuses a
# moved fingerprint), and the PL/SQL analyser reads PostgreSQL with Oracle
# rules (VARCHAR2, comment syntax): nothing flagged there can be changed.
sonar.issue.ignore.multicriteria.flyway.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.flyway.resourceKey=src/main/resources/db/migration/**

# HTML mail layout: mail clients (Outlook above all) only lay out tables with
# width/cellpadding/cellspacing/align attributes; CSS alone is not honoured.
sonar.issue.ignore.multicriteria.mailtables.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.mailtables.resourceKey=src/main/resources/templates/mail/**

# Fixture generator: the pseudo-random draws build a demo scenario from a
# seed, reproducibility is the point and nothing is security-sensitive.
sonar.issue.ignore.multicriteria.fixturerandom.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.fixturerandom.resourceKey=src/main/resources/generate.py

# Developer CLI run by hand on a file the operator names (docs/import-export.md);
# confining it to the working directory would only forbid legitimate paths.
sonar.issue.ignore.multicriteria.cliargs.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cliargs.resourceKey=src/main/resources/anonymiser-scenario.py

# MCP tools: each parameter of a tool method is one published argument of the
# tool's input schema; grouping them into an object would change the contract
# every MCP client sees.
sonar.issue.ignore.multicriteria.mcptoolargs.ruleKey=java:S107
sonar.issue.ignore.multicriteria.mcptoolargs.resourceKey=src/main/java/**/mcp/*McpTools.java

# tsconfig files are JSONC: TypeScript reads their comments, which document
# why each compiler option is set.
sonar.issue.ignore.multicriteria.tsconfigjsonc.ruleKey=json:S2260
sonar.issue.ignore.multicriteria.tsconfigjsonc.resourceKey=src/main/webui/tsconfig*.json

# The Material Icons ligature font: a generic fallback family would render the
# ligature names as words instead of icons.
sonar.issue.ignore.multicriteria.iconfont.ruleKey=css:S4649
sonar.issue.ignore.multicriteria.iconfont.resourceKey=src/main/webui/src/styles/fonts.css

# Developer and CI scripts call git from the PATH; pinning an absolute path
# would break every machine whose git lives elsewhere (macOS, mise).
sonar.issue.ignore.multicriteria.scriptspath.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.scriptspath.resourceKey=src/main/webui/scripts/**

# Command-line tools run through exec:java: standard output is their output.
sonar.issue.ignore.multicriteria.clistdout.ruleKey=java:S106
sonar.issue.ignore.multicriteria.clistdout.resourceKey=src/main/java/dev/sylvain/planning/scenario/Scenario*.java

# BusinessError extends IllegalArgumentException on purpose (AGENTS.md): a
# plain one still falls through to its 500 and its Sentry alert.
sonar.issue.ignore.multicriteria.businesserror.ruleKey=java:S110
sonar.issue.ignore.multicriteria.businesserror.resourceKey=src/main/java/dev/sylvain/planning/service/BusinessError.java

# The shipped default password is spelled out precisely so that a deployment
# still using it can be detected and refused; it protects nothing.
sonar.issue.ignore.multicriteria.defaultsecret.ruleKey=java:S2068
sonar.issue.ignore.multicriteria.defaultsecret.resourceKey=**/DefaultSecrets.java

# ReferenceDataService is the deliberate facade over one service per
# referential family (AGENTS.md): its many collaborators are the families.
sonar.issue.ignore.multicriteria.referentialfacade.ruleKey=java:S6539
sonar.issue.ignore.multicriteria.referentialfacade.resourceKey=src/main/java/dev/sylvain/planning/service/referentiel/ReferenceDataService.java

# NotificationService.push(severity, title) is the service's own method, not
# Array#push: each call records one notification and cannot be merged.
sonar.issue.ignore.multicriteria.notificationpush.ruleKey=typescript:S7778
sonar.issue.ignore.multicriteria.notificationpush.resourceKey=src/main/webui/src/app/core/notification.service.spec.ts

# The event's hours are wall-clock times with no zone, on purpose: a rest or an
# opening span counts the hours on the site's clocks. A zoned type would add or
# drop an hour on the night the clocks change, and invent a zone the model
# does not carry.
sonar.issue.ignore.multicriteria.localsolver.ruleKey=java:S8700
sonar.issue.ignore.multicriteria.localsolver.resourceKey=src/main/java/dev/sylvain/planning/solver/**
sonar.issue.ignore.multicriteria.localdomain.ruleKey=java:S8700
sonar.issue.ignore.multicriteria.localdomain.resourceKey=src/main/java/dev/sylvain/planning/domain/**
sonar.issue.ignore.multicriteria.localpauses.ruleKey=java:S8700
sonar.issue.ignore.multicriteria.localpauses.resourceKey=src/main/java/dev/sylvain/planning/service/analyse/PauseAnalyzer.java

# Timefold's collector API types the accumulator as a wildcard
# (UniConstraintCollector<A, ?, R>): there is no other way to write it.
sonar.issue.ignore.multicriteria.timefoldcollector.ruleKey=java:S1452
sonar.issue.ignore.multicriteria.timefoldcollector.resourceKey=src/main/java/dev/sylvain/planning/solver/constraints/PastSeats.java

# OuvertureStand is equal by identity, defined once in FenetreDateeStand with
# an exact class check; comparing its staffing would break that identity.
sonar.issue.ignore.multicriteria.ouvertureidentity.ruleKey=java:S2160
sonar.issue.ignore.multicriteria.ouvertureidentity.resourceKey=src/main/java/dev/sylvain/planning/domain/OuvertureStand.java

# Structural tests read the repository's own source one line at a time; their
# declaration patterns (a type of words, then a name, then a parenthesis) need
# the overlap Sonar calls backtracking, and removing it changes what they see.
sonar.issue.ignore.multicriteria.structdoc.ruleKey=java:S8786
sonar.issue.ignore.multicriteria.structdoc.resourceKey=src/test/java/dev/sylvain/planning/DocumentationStructuralTest.java
sonar.issue.ignore.multicriteria.structlang.ruleKey=java:S8786
sonar.issue.ignore.multicriteria.structlang.resourceKey=src/test/java/dev/sylvain/planning/LanguagePolicyStructuralTest.java
sonar.issue.ignore.multicriteria.structiso.ruleKey=java:S8786
sonar.issue.ignore.multicriteria.structiso.resourceKey=src/test/java/dev/sylvain/planning/service/IsolationEditionStructurelleTest.java
sonar.issue.ignore.multicriteria.structjournal.ruleKey=java:S8786
sonar.issue.ignore.multicriteria.structjournal.resourceKey=src/test/java/dev/sylvain/planning/service/journal/JournalCoverageStructurelleTest.java

# Same structural-test patterns as above: the overlap is what they read, and
# no rewrite found sees exactly the same matches.
sonar.issue.ignore.multicriteria.structrefus.ruleKey=java:S8786
sonar.issue.ignore.multicriteria.structrefus.resourceKey=src/test/java/dev/sylvain/planning/service/solve/RefusedWhileSolvingStructuralTest.java
sonar.issue.ignore.multicriteria.structgel.ruleKey=java:S8786
sonar.issue.ignore.multicriteria.structgel.resourceKey=src/test/java/dev/sylvain/planning/service/referentiel/GelReferentielStructuralTest.java
sonar.issue.ignore.multicriteria.structparams.ruleKey=java:S8786
sonar.issue.ignore.multicriteria.structparams.resourceKey=src/test/java/dev/sylvain/planning/solver/ConstraintParametersStructuralTest.java

# angular-renovate.yml recomputes the lock file Renovate could not write:
# `npm ci` fails by construction on exactly the state this job repairs.
sonar.issue.ignore.multicriteria.angularlock.ruleKey=githubactions:S8543
sonar.issue.ignore.multicriteria.angularlock.resourceKey=.github/workflows/angular-renovate.yml

# Not stored credentials: the smoke test's admin password is drawn by
# `openssl rand`, and the E2E stack's are throwaway values of a service
# container that lives as long as the job (`services.env` cannot read a
# value an earlier step generated).
sonar.issue.ignore.multicriteria.ghcrpassword.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.ghcrpassword.resourceKey=.github/workflows/docker-ghcr.yml
sonar.issue.ignore.multicriteria.e2epassword.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.e2epassword.resourceKey=.github/workflows/e2e-suite.yml

# Sequential on purpose: a bulk edit keeps each failure tied to its id and
# sends no burst of concurrent writes; the rules page stops at the first
# failure and only drops from the draft what was already saved.
sonar.issue.ignore.multicriteria.bulksequential.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.bulksequential.resourceKey=src/main/webui/src/app/core/reference-data.store.ts
