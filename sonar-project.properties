sonar.issue.ignore.multicriteria.ifelselink.ruleKey=Web:LinksIdenticalTextsDifferentTargetsCheck
sonar.issue.ignore.multicriteria.ifelselink.resourceKey=src/main/webui/src/app/pages/aide/aide-page.html

