# Thème « planning » de la console de compte — là où chacun règle son mot de
# passe, sa passkey et son second facteur.
#
# `parent=keycloak.v3` : la console elle-même (une application React
# PatternFly 5) vient du thème natif et en suit les mises à jour. Ce thème n'y
# ajoute que trois choses, par les seules propriétés que keycloak.v3 lit :
#
#   - `logo`   : le logo du client, pris dans le même dossier brand/ que la
#                page de connexion et les e-mails (lien symbolique posé par
#                docker/keycloak/Dockerfile) ;
#   - `styles` : la couche commune (couleurs du produit), puis brand.css, le
#                fichier du client, qui l'emporte ;
#   - le lien « Retour à Planning Équipes » n'est pas une propriété : la
#     console l'affiche d'elle-même quand l'application l'ouvre avec
#     `referrer` et `referrer_uri` (GET /api/auth/oidc/compte).
parent=keycloak.v3
import=common/keycloak
locales=fr,en

logo=/brand/logo.svg
styles=css/planning-account.css brand/brand.css
