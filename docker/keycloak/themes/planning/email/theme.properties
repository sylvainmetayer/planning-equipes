# Thème e-mail « planning » : un habillage autour des messages natifs de
# Keycloak (invitation, réinitialisation, vérification d'adresse), qui restent
# ceux du thème de base — traductions comprises. Seul html/template.ftl, le
# cadre commun à tous, est surchargé.
parent=base
locales=fr,en

# La même variable que pour la page de connexion, et pour la même couleur : un
# e-mail ne peut pas lire brand.css, c'est donc l'environnement qui les tient
# ensemble. Vide, le gabarit prend la couleur d'accent standard.
brandAccent=${env.KEYCLOAK_BRAND_ACCENT:}
