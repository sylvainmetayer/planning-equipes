  </defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <circle cx="1350" cy="180" r="420" fill="#3a6ea5" opacity="0.07"/>
  <circle cx="220" cy="860" r="360" fill="#3a6ea5" opacity="0.06"/>
</svg>
