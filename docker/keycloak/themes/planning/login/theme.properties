# Thème « planning » — la couche standard au-dessus du thème natif keycloak.v2.
#
# Ce que ce thème possède, et ce qu'il ne possède pas :
#
#   - `css/planning.css` est la partie commune à tous les déploiements :
#     typographie, carte, mise en couleur des composants PatternFly par UNE
#     variable, `--planning-accent`.
#   - `brand/` est la partie qui appartient au client : logo, image de fond,
#     `brand.css`. Le dossier du dépôt contient les visuels neutres du produit ;
#     en production, il est REMPLACÉ par un montage de volume
#     (docs/keycloak.md § Le thème). Aucune reconstruction d'image.
#   - `KEYCLOAK_BRAND_ACCENT` pose la couleur d'accent depuis l'environnement,
#     pour la connexion ET les e-mails d'un coup — un e-mail ne sait pas lire un
#     fichier CSS monté, une variable est la seule chose qu'ils peuvent
#     partager. Voir footer.ftl.
#
# `parent=keycloak.v2` : chaque page (mot de passe, OTP, passkey, codes de
# secours, erreurs) vient du thème natif et en suit les mises à jour. Rien
# n'est recopié — seul footer.ftl, que le parent déclare surchargeable, l'est.
parent=keycloak.v2
import=common/keycloak
locales=fr,en

# Substitution au chargement : `${env.X:défaut}` est résolu par Keycloak
# (StringPropertyReplacer), vide si la variable n'est pas posée.
brandAccent=${env.KEYCLOAK_BRAND_ACCENT:}

# Dans cet ordre : le parent, la couche commune, puis ce que le client monte.
styles=css/styles.css css/planning.css brand/brand.css
