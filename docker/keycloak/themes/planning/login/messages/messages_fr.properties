# Le nom du realm devient le conteneur du logo : c'est exactement ce que fait
# le realm « master » de Keycloak avec son propre logo (displayNameHtml), sauf
# qu'ici le thème le fait pour tout realm qui l'emploie — le realm n'a rien à
# déclarer. Le <span> garde le nom pour les lecteurs d'écran ; planning.css le
# retire de l'affichage sans le retirer de l'arbre d'accessibilité.
loginTitleHtml=<div class="kc-logo-text"><span>{0}</span></div>
